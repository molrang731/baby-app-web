<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>회원가입 - 오늘도육아</title>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{width:100%;min-height:100%;}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;
      background:#fff7fb;
      color:#241f21;
      overflow-x:hidden;
    }
    button,input,textarea{font-family:inherit;}
    button{cursor:pointer;}
    a{text-decoration:none;color:inherit;}

    .app{
      width:100%;
      max-width:430px;
      min-height:100vh;
      margin:0 auto;
      padding:20px 16px 28px;
      position:relative;
      overflow:hidden;
    }
    .app::before{
      content:'';
      position:fixed;
      width:280px;
      height:280px;
      border-radius:50%;
      background:#ffd6e7;
      top:-115px;
      left:-120px;
      opacity:.45;
      z-index:-1;
    }
    .app::after{
      content:'';
      position:fixed;
      width:220px;
      height:220px;
      border-radius:50%;
      background:#ffc8dc;
      right:-95px;
      bottom:-90px;
      opacity:.30;
      z-index:-1;
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:16px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      color:#ff5c8a;
      font-size:21px;
      font-weight:900;
      letter-spacing:-.7px;
      white-space:nowrap;
    }
    .mini-logo{
      width:19px;
      height:19px;
      border-radius:50%;
      background:#ff5c8a;
      position:relative;
      display:inline-block;
      flex-shrink:0;
    }
    .mini-logo::after{
      content:'';
      position:absolute;
      width:19px;
      height:19px;
      border-radius:50%;
      background:#ffe4ef;
      top:-2px;
      left:7px;
    }
    .top-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-shrink:0;}
    .back-link,.dark-mode-toggle{
      min-height:38px;
      padding:0 13px;
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#fff;
      color:#ff5c8a;
      border:1px solid #ffd6e7;
      box-shadow:0 8px 22px rgba(255,92,138,.08);
      font-size:12px;
      font-weight:900;
      white-space:nowrap;
    }
    .dark-mode-toggle{min-width:38px;padding:0 11px;}

    .join-hero{
      background:#fff;
      border:1px solid #f3dfe7;
      border-radius:26px;
      padding:20px 18px;
      margin-bottom:13px;
      box-shadow:0 10px 24px rgba(255,92,138,.075);
      position:relative;
      overflow:hidden;
    }
    .join-hero::after{
      content:'';
      position:absolute;
      width:118px;
      height:118px;
      border-radius:50%;
      background:#ffd6e7;
      right:-42px;
      top:-48px;
      opacity:.38;
    }
    .hero-label{
      display:inline-flex;
      align-items:center;
      gap:6px;
      background:#fff0f5;
      color:#ff5c8a;
      border:1px solid #ffd6e7;
      padding:7px 11px;
      border-radius:999px;
      font-size:11.5px;
      font-weight:900;
      margin-bottom:12px;
      position:relative;
      z-index:2;
    }
    h1{
      font-size:24px;
      line-height:1.34;
      letter-spacing:-.85px;
      color:#241f21;
      margin-bottom:7px;
      position:relative;
      z-index:2;
    }
    h1 span{color:#ff5c8a;}
    .sub{
      color:#7d7276;
      font-size:13.5px;
      line-height:1.58;
      font-weight:700;
      position:relative;
      z-index:2;
    }

    .join-card{
      background:#fff;
      border:1px solid #f3dfe7;
      border-radius:24px;
      padding:17px 15px 18px;
      box-shadow:0 10px 24px rgba(255,92,138,.075);
      margin-bottom:14px;
    }
    .card-title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:13px;
    }
    .card-title strong{
      font-size:17px;
      color:#241f21;
      font-weight:900;
      letter-spacing:-.5px;
    }
    .card-title span{
      color:#aa9ba1;
      font-size:11.5px;
      font-weight:900;
      white-space:nowrap;
    }

    .input-group{display:flex;flex-direction:column;gap:9px;margin-bottom:14px;}
    input,textarea{
      width:100%;
      border:none;
      outline:none;
      background:#fff7fa;
      border:1px solid #f3dfe7;
      border-radius:18px;
      padding:14px 15px;
      font-size:14.5px;
      color:#2f272a;
      font-weight:700;
    }
    input::placeholder,textarea::placeholder{color:#aa9ba1;font-weight:700;}
    input:focus,textarea:focus{
      background:#fff;
      border-color:#ff8fb1;
      box-shadow:0 0 0 4px rgba(255,92,138,.08);
    }
    textarea{height:92px;resize:none;line-height:1.65;}

    .section-title{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      color:#51464a;
      font-size:13px;
      font-weight:900;
      margin:15px 0 9px;
    }
    .section-title small{font-size:11px;color:#aa9ba1;font-weight:900;}
    .stage-box,.category-box{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
    .category-box{grid-template-columns:repeat(3,1fr);}
    .option input{display:none;}
    .option span{
      min-height:56px;
      border-radius:17px;
      background:#fff7fa;
      border:1px solid #f3dfe7;
      color:#7d7276;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      font-size:12.5px;
      font-weight:900;
      padding:10px 6px;
      cursor:pointer;
      transition:.16s ease;
      line-height:1.25;
    }
    .category-box .option span{min-height:52px;font-size:11.5px;border-radius:16px;}
    .option input:checked + span{
      background:#ff5c8a;
      color:#fff;
      border-color:#ff5c8a;
      box-shadow:0 9px 20px rgba(255,92,138,.20);
      transform:translateY(-1px);
    }
    .category-box .option input:checked + span{
      background:#fff0f5;
      color:#ff5c8a;
      border-color:#ff8fb1;
      box-shadow:0 8px 18px rgba(255,92,138,.10);
    }

    .join-submit,.kakao-btn{
      width:100%;
      min-height:51px;
      border:none;
      border-radius:18px;
      font-size:14.5px;
      font-weight:900;
      margin-top:10px;
    }
    .join-submit{
      background:#ff5c8a;
      color:#fff;
      box-shadow:0 12px 26px rgba(255,92,138,.22);
      margin-top:17px;
    }
    .kakao-btn{background:#FEE500;color:#191919;box-shadow:none;}
    button:active{transform:scale(.985);}
    button:disabled{opacity:.65;cursor:not-allowed;transform:none;}
    .login-link{
      text-align:center;
      margin-top:15px;
      color:#7d7276;
      font-size:13px;
      line-height:1.5;
      font-weight:800;
    }
    .login-link a{color:#ff5c8a;font-weight:900;}
    .trust-note{
      background:#fff7fa;
      border:1px solid #f3dfe7;
      border-radius:20px;
      padding:13px;
      text-align:center;
      color:#8d7c83;
      font-size:12.5px;
      line-height:1.55;
      font-weight:800;
    }

    body.dark-mode{background:#181216;color:#f7edf2;}
    body.dark-mode .app::before{background:#573040;opacity:.36;}
    body.dark-mode .app::after{background:#7a344d;opacity:.24;}
    body.dark-mode .brand{color:#ff8fb1;}
    body.dark-mode .mini-logo{background:#ff8fb1;}
    body.dark-mode .mini-logo::after{background:#2a1d24;}
    body.dark-mode .back-link,
    body.dark-mode .dark-mode-toggle,
    body.dark-mode .join-card,
    body.dark-mode .join-hero,
    body.dark-mode .trust-note{
      background:#261b22;
      border-color:#4a303b;
      color:#f5e8ee;
      box-shadow:0 12px 26px rgba(0,0,0,.24);
    }
    body.dark-mode .join-hero::after{background:#573040;opacity:.32;}
    body.dark-mode .hero-label{background:#3a2430;color:#ff8fb1;border-color:#5b3747;}
    body.dark-mode h1,
    body.dark-mode .card-title strong{color:#fff6fa;}
    body.dark-mode h1 span{color:#ff8fb1;}
    body.dark-mode .sub,
    body.dark-mode .card-title span,
    body.dark-mode .section-title small,
    body.dark-mode .login-link,
    body.dark-mode .trust-note{color:#c9aeb9;}
    body.dark-mode input,
    body.dark-mode textarea,
    body.dark-mode .option span{background:#2f2028;border-color:#4a303b;color:#f5e8ee;}
    body.dark-mode input::placeholder,
    body.dark-mode textarea::placeholder{color:#bfa5b0;}
    body.dark-mode input:focus,
    body.dark-mode textarea:focus{background:#34242d;border-color:#ff8fb1;box-shadow:0 0 0 4px rgba(255,143,177,.12);}
    body.dark-mode .section-title{color:#f5e8ee;}
    body.dark-mode .category-box .option input:checked + span{background:#3a2430;color:#ff8fb1;border-color:#5b3747;}
    body.dark-mode .login-link a{color:#ff8fb1;}

    @media(max-width:390px){
      .app{padding-left:13px;padding-right:13px;}
      .join-hero{padding:18px 16px;border-radius:24px;}
      h1{font-size:22.5px;}
      .join-card{padding:16px 13px 17px;border-radius:23px;}
      .category-box{grid-template-columns:repeat(2,1fr);}
      .option span{font-size:12px;}
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="top">
      <div class="brand">
        <span class="mini-logo"></span>
        오늘도육아
      </div>

      <div class="top-actions">
        <button class="dark-mode-toggle" data-mode="icon" onclick="toggleDarkMode()" type="button" aria-label="야간모드 전환">🌙</button>
        <a href="index.html" class="back-link">로그인</a>
      </div>
    </div>

    <section class="join-hero">
      <div class="hero-label">TODAY JOIN</div>
      <h1>
        함께 버티는 육아,<br>
        <span>혼자가 아니에요</span> 💗
      </h1>
      <p class="sub">
        닉네임으로 편하게 시작하고,<br>
        나와 비슷한 육아 이야기를 만나보세요.
      </p>
    </section>

    <div class="join-card">
      <div class="card-title">
        <strong>가입 정보</strong>
        <span>1분이면 충분해요</span>
      </div>

      <div class="input-group">
        <input type="text" id="nickname" placeholder="닉네임 입력" autocomplete="nickname">
        <input type="text" id="loginId" placeholder="아이디 입력" autocomplete="username" inputmode="text">
        <input type="password" id="password" placeholder="비밀번호 6자리 이상" autocomplete="new-password">
      </div>

      <div class="section-title">
        <span>육아 단계 선택</span>
        <small>현재 상황에 가까운 단계</small>
      </div>

      <div class="stage-box">
        <label class="option"><input type="radio" name="stage" value="예비부모" checked><span>🤰 예비부모</span></label>
        <label class="option"><input type="radio" name="stage" value="신생아"><span>🍼 신생아</span></label>
        <label class="option"><input type="radio" name="stage" value="영유아"><span>🧸 영유아</span></label>
        <label class="option"><input type="radio" name="stage" value="어린이"><span>🧒 어린이</span></label>
      </div>

      <div class="section-title">
        <span>관심 카테고리</span>
        <small>여러 개 선택 가능</small>
      </div>

      <div class="category-box">
        <label class="option"><input type="checkbox" value="출산준비"><span>🤰<br>출산준비</span></label>
        <label class="option"><input type="checkbox" value="새벽육아"><span>🌙<br>새벽육아</span></label>
        <label class="option"><input type="checkbox" value="신생아"><span>🍼<br>신생아</span></label>
        <label class="option"><input type="checkbox" value="영유아"><span>🧸<br>영유아</span></label>
        <label class="option"><input type="checkbox" value="어린이"><span>🧒<br>어린이</span></label>
      </div>

      <div class="section-title">
        <span>상태메시지</span>
        <small>나중에 수정 가능</small>
      </div>

      <textarea id="status" placeholder="예: 초보엄마예요 💕"></textarea>

      <button id="joinBtn" class="join-submit" type="button">회원가입하기</button>
      <button id="kakaoBtn" class="kakao-btn" type="button">카카오톡으로 시작하기</button>

      <div class="login-link">
        이미 계정이 있다면 <a href="index.html">로그인하기</a>
      </div>
    </div>

    <div class="trust-note">
      아이디는 로그인에만 사용되고, 앱에서는 닉네임으로 활동해요.
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      OAuthProvider,
      signInWithRedirect,
      getRedirectResult
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD4x9d4aQlbroxcnT2v-zHODDPdQabIFx0",
      authDomain: "today-parenting-app.firebaseapp.com",
      projectId: "today-parenting-app",
      storageBucket: "today-parenting-app.firebasestorage.app",
      messagingSenderId: "375329953167",
      appId: "1:375329953167:web:d29af0e45cc7d10e9f67fa"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const joinBtn = document.getElementById("joinBtn");
    const kakaoBtn = document.getElementById("kakaoBtn");
    const nickname = document.getElementById("nickname");
    const loginId = document.getElementById("loginId");
    const password = document.getElementById("password");
    const status = document.getElementById("status");

    function makeEmailFromId(id){
      return id.trim().toLowerCase() + "@todayparenting.local";
    }

    function getCategories(){
      const checkedCategories = document.querySelectorAll(".category-box input:checked");
      const categories = [];

      checkedCategories.forEach((item) => {
        categories.push(item.value);
      });

      return categories;
    }

    joinBtn.addEventListener("click", async () => {
      const checkedStage = document.querySelector("input[name='stage']:checked");
      const categories = getCategories();

      if(nickname.value.trim() === ""){
        alert("닉네임을 입력해주세요.");
        return;
      }

      if(loginId.value.trim() === ""){
        alert("아이디를 입력해주세요.");
        return;
      }

      if(!/^[a-zA-Z0-9_]{4,16}$/.test(loginId.value.trim())){
        alert("아이디는 영문, 숫자, 언더바(_)만 사용해서 4~16자로 입력해주세요.");
        return;
      }

      if(password.value.trim().length < 6){
        alert("비밀번호는 6자리 이상 입력해주세요.");
        return;
      }

      try{
        joinBtn.disabled = true;
        joinBtn.innerText = "가입 중...";

        const fakeEmail = makeEmailFromId(loginId.value);

        const userCredential = await createUserWithEmailAndPassword(
          auth,
          fakeEmail,
          password.value
        );

        const user = userCredential.user;

        await setDoc(doc(db, "users", user.uid), {
          uid: user.uid,
          nickname: nickname.value.trim(),
          displayName: nickname.value.trim(),
          loginId: loginId.value.trim(),
          email: fakeEmail,
          realEmail: "",
          loginType: "id",
          stage: checkedStage.value,
          categories: categories,
          status: status.value.trim() || "초보엄마예요 💕",
          bio: status.value.trim() || "",
          photoUrl: "",
          photoURL: "",
          profileVisibility: "public",
          createdAt: new Date(),
          updatedAt: new Date()
        });

        alert("회원가입이 완료됐어요 💕");
        window.location.href = "home.html";
      } catch(error){
        console.error("회원가입 오류:", error);

        if(error.code === "auth/email-already-in-use"){
          alert("이미 사용 중인 아이디예요.");
        } else if(error.code === "permission-denied"){
          alert("Firestore 권한 오류예요. users 규칙을 다시 확인해주세요.");
        } else {
          alert(error.message || "회원가입 중 오류가 발생했어요.");
        }
      } finally {
        joinBtn.disabled = false;
        joinBtn.innerText = "회원가입하기";
      }
    });

    [nickname, loginId, password, status].forEach((input) => {
      input.addEventListener("keydown", (event) => {
        if(event.key === "Enter"){
          event.preventDefault();
          joinBtn.click();
        }
      });
    });

    kakaoBtn.addEventListener("click", async () => {
      try{
        const provider = new OAuthProvider("oidc.kakao");
        await signInWithRedirect(auth, provider);
      } catch(error){
        alert(error.message);
      }
    });

    async function checkKakaoRedirect(){
      try{
        const result = await getRedirectResult(auth);

        if(!result){
          return;
        }

        const user = result.user;
        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);

        if(!userSnap.exists()){
          await setDoc(userRef, {
            uid: user.uid,
            nickname: user.displayName || "카카오사용자",
            displayName: user.displayName || "카카오사용자",
            loginId: "",
            email: user.email || "",
            realEmail: user.email || "",
            loginType: "kakao",
            stage: "예비부모",
            categories: ["출산준비"],
            status: "초보엄마예요 💕",
            bio: "",
            photoUrl: user.photoURL || "",
            photoURL: user.photoURL || "",
            profileVisibility: "public",
            createdAt: new Date(),
            updatedAt: new Date()
          });
        }

        window.location.href = "home.html";
      } catch(error){
        console.log(error.message);
      }
    }

    checkKakaoRedirect();
  </script>

  <script src="theme.js"></script>

</body>
</html>
