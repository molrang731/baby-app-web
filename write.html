<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>글쓰기 - 오늘도육아</title>

<link rel="stylesheet" href="theme.css">

    <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{width:100%;min-height:100%;}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;
      background:#fff7fb;
      color:#241f21;
      padding-bottom:112px;
      overflow-x:hidden;
    }
    button,input,textarea{font-family:inherit;}
    button{cursor:pointer;}
    a{text-decoration:none;color:inherit;}

    .header{
      position:sticky;
      top:0;
      z-index:100;
      background:rgba(255,255,255,.94);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      border-bottom:1px solid #f4dce6;
      box-shadow:0 4px 18px rgba(255,92,138,.055);
    }
    .header-inner{
      width:100%;
      max-width:430px;
      margin:0 auto;
      padding:13px 16px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      color:#ff5c8a;
      font-size:21px;
      font-weight:900;
      letter-spacing:-.7px;
      white-space:nowrap;
    }
    .mini-logo{
      width:19px;
      height:19px;
      border-radius:50%;
      background:#ff5c8a;
      position:relative;
      display:inline-block;
      flex-shrink:0;
    }
    .mini-logo::after{
      content:'';
      position:absolute;
      width:19px;
      height:19px;
      border-radius:50%;
      background:#ffe4ef;
      top:-2px;
      left:7px;
    }
    .header-actions{
      display:flex;
      gap:8px;
      align-items:center;
      justify-content:flex-end;
      flex-shrink:0;
    }
    .pill,.back-link{
      min-height:38px;
      padding:0 13px;
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#fff;
      color:#ff5c8a;
      border:1px solid #ffd6e7;
      box-shadow:0 8px 22px rgba(255,92,138,.08);
      font-size:12px;
      font-weight:900;
      white-space:nowrap;
    }
    .dark-mode-toggle{min-width:38px;padding:0 11px;}

    .container{
      width:100%;
      max-width:430px;
      margin:0 auto;
      padding:14px 13px 22px;
    }
    .card{
      background:#fff;
      border:1px solid #f3dfe7;
      border-radius:24px;
      padding:17px 15px 18px;
      box-shadow:0 10px 24px rgba(255,92,138,.075);
      overflow:hidden;
    }
    .label{
      display:inline-flex;
      align-items:center;
      gap:6px;
      background:#fff0f5;
      color:#ff5c8a;
      border:1px solid #ffd6e7;
      padding:7px 11px;
      border-radius:999px;
      font-size:11.5px;
      font-weight:900;
      margin-bottom:12px;
    }
    h2{
      font-size:22px;
      line-height:1.34;
      letter-spacing:-.8px;
      color:#241f21;
      margin-bottom:7px;
    }
    .sub{
      color:#8d7c83;
      font-size:13px;
      line-height:1.55;
      margin-bottom:17px;
    }
    .section-title{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      margin-bottom:9px;
      color:#51464a;
      font-size:13px;
      font-weight:900;
    }
    .draft-state{
      color:#aa9ba1;
      font-size:11px;
      font-weight:900;
      white-space:nowrap;
    }

    .category-box{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:7px;
      margin-bottom:16px;
    }
    .category-option input{display:none;}
    .category-option span{
      min-height:64px;
      border-radius:17px;
      background:#fff7fa;
      border:1px solid #f3dfe7;
      color:#7d7276;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:5px;
      font-size:10.8px;
      font-weight:900;
      text-align:center;
      cursor:pointer;
      transition:.16s ease;
    }
    .category-option b{
      font-size:19px;
      line-height:1;
      font-weight:400;
    }
    .category-option input:checked + span{
      background:#ff5c8a;
      color:#fff;
      border-color:#ff5c8a;
      box-shadow:0 9px 20px rgba(255,92,138,.20);
      transform:translateY(-1px);
    }

    .writing-paper{
      margin:13px 0 15px;
      background:#fff;
      border:1px solid #f3dfe7;
      border-radius:22px;
      overflow:hidden;
      box-shadow:0 8px 20px rgba(255,92,138,.055);
    }
    .writing-paper:focus-within{
      border-color:#ff8fb1;
      box-shadow:0 0 0 4px rgba(255,92,138,.08),0 10px 22px rgba(255,92,138,.075);
    }
    .paper-head{padding:14px 14px 0;}
    .paper-label{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      margin-bottom:8px;
      color:#ff5c8a;
      font-size:12px;
      font-weight:900;
      letter-spacing:-.2px;
    }
    .paper-label span:last-child{
      color:#b09fa6;
      font-size:11px;
      white-space:nowrap;
    }
    .paper-title-input{
      width:100%;
      border:none;
      outline:none;
      background:transparent;
      color:#241f21;
      font-size:19px;
      line-height:1.42;
      font-weight:900;
      letter-spacing:-.6px;
      padding:4px 0 14px;
    }
    .paper-title-input::placeholder{
      color:#b7a8ae;
      font-weight:800;
    }
    .paper-divider{
      height:1px;
      background:#f5e4eb;
      margin:0 14px;
    }
    .paper-body{padding:13px 14px 14px;}
    .paper-content-input{
      width:100%;
      min-height:190px;
      border:none;
      outline:none;
      resize:none;
      background:transparent;
      color:#5f5357;
      font-size:14.5px;
      line-height:1.75;
      font-weight:600;
      letter-spacing:-.25px;
    }
    .paper-content-input::placeholder{
      color:#aa9ba1;
      font-weight:700;
    }
    .paper-counts{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 14px 13px;
      background:#fffbfc;
      border-top:1px solid #f7e6ed;
      color:#aa9ba1;
      font-size:11.5px;
      font-weight:900;
    }
    .paper-count-right{
      display:flex;
      gap:9px;
      color:#b09fa6;
      flex-shrink:0;
    }
    .paper-counts.warning,
    .paper-counts.warning .paper-count-right,
    #contentCountRow.warning{
      color:#ff5c8a;
    }

    .upload-box{margin:15px 0 17px;}
    .upload-label{
      width:100%;
      min-height:64px;
      border-radius:20px;
      background:#fff7fa;
      border:1.5px dashed #ffb3c9;
      color:#ff5c8a;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      font-size:13px;
      font-weight:900;
      cursor:pointer;
    }
    .upload-label span{
      width:27px;
      height:27px;
      border-radius:50%;
      background:#fff0f5;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:18px;
      line-height:1;
    }
    #imageInput{display:none;}
    .preview-grid{
      display:none;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
      margin-top:12px;
    }
    .preview-item{
      position:relative;
      aspect-ratio:1/1;
      border-radius:18px;
      overflow:hidden;
      background:#fff7fa;
      border:1px solid #f3dfe7;
    }
    .preview-item img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .remove-image{
      position:absolute;
      right:6px;
      top:6px;
      width:25px;
      height:25px;
      border:none;
      border-radius:50%;
      background:rgba(255,255,255,.95);
      color:#ff5c8a;
      font-size:16px;
      font-weight:900;
      box-shadow:0 5px 12px rgba(0,0,0,.08);
    }
    .helper{
      margin-top:8px;
      color:#9c8b91;
      font-size:11.5px;
      line-height:1.5;
      text-align:center;
      font-weight:800;
    }
    .button-row{
      display:grid;
      grid-template-columns:1fr 1.15fr;
      gap:9px;
    }
    .draft-btn,.post-btn{
      width:100%;
      min-height:51px;
      border-radius:18px;
      border:none;
      font-size:14px;
      font-weight:900;
    }
    .draft-btn{
      background:#fff;
      color:#ff5c8a;
      border:1px solid #ffd6e7;
    }
    .post-btn{
      background:#ff5c8a;
      color:#fff;
      box-shadow:0 12px 26px rgba(255,92,138,.22);
    }
    .draft-btn:active,.post-btn:active{transform:scale(.985);}
    .draft-btn:disabled,.post-btn:disabled{opacity:.65;cursor:not-allowed;}
    .loading-box{
      display:none;
      margin-top:13px;
      background:#fff7fa;
      border:1px solid #f3dfe7;
      color:#ff5c8a;
      border-radius:18px;
      padding:13px;
      text-align:center;
      font-size:13px;
      font-weight:900;
    }
    .loading-box.active{display:block;}

    .bottom-menu{
      position:fixed;
      left:0;
      bottom:14px;
      width:100%;
      z-index:999;
      padding:0 14px env(safe-area-inset-bottom);
      pointer-events:none;
    }
    .bottom-inner{
      width:100%;
      max-width:430px;
      height:78px;
      margin:0 auto;
      display:flex;
      justify-content:space-around;
      align-items:center;
      background:rgba(255,255,255,.97);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      border:1px solid rgba(255,214,231,.9);
      border-radius:30px;
      box-shadow:0 14px 34px rgba(255,92,138,.15);
      pointer-events:auto;
    }
    .bottom-menu a,.menu-item{
      width:25%;
      height:100%;
      color:#7d6c72;
      font-size:12px;
      text-align:center;
      font-weight:900;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:5px;
      position:relative;
    }
    .menu-icon{
      width:45px;
      height:45px;
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#7d6c72;
      position:relative;
      transition:.16s ease;
    }
    .menu-icon.home-icon::after{
     content:'❤';
     position:absolute;
     top:-6px;
     right:1px;
     width:17px;
     height:17px;
     border-radius:50%;
     background:#ff8fb1;
     color:white;
     font-size:10px;
     line-height:17px;
     text-align:center;
     box-shadow:0 5px 12px rgba(255,92,138,.22);
   }
    .menu-icon svg{
      width:26px;
      height:26px;
      stroke:currentColor;
      stroke-width:1.9;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
      display:block;
    }
    .menu-item.active,.bottom-menu a.active{color:#ff5c8a;}
    .menu-item.active .menu-icon,.bottom-menu a.active .menu-icon{
      color:#ff5c8a;
      background:linear-gradient(135deg,#fff0f5,#ffe3ee);
      box-shadow:0 10px 24px rgba(255,92,138,.14);
      transform:translateY(-2px);
    }
    .notification-link,.notification-icon{position:relative;}
    .notification-badge{
      position:absolute;
      top:-6px;
      right:-7px;
      min-width:18px;
      height:18px;
      padding:0 5px;
      background:#ff2f6d;
      color:#fff;
      border-radius:999px;
      font-size:10px;
      font-weight:900;
      line-height:18px;
      text-align:center;
      display:none;
      box-shadow:0 4px 10px rgba(255,47,109,.35);
      border:2px solid #fff;
    }

    body.dark-mode{
      background:#181216;
      color:#f7edf2;
    }
    body.dark-mode .header{
      background:rgba(28,20,25,.94);
      border-color:#3a2730;
    }
    body.dark-mode .brand{color:#ff8fb1;}
    body.dark-mode .mini-logo{background:#ff8fb1;}
    body.dark-mode .mini-logo::after{background:#2a1d24;}
    body.dark-mode .card,
    body.dark-mode .writing-paper{
      background:#261b22;
      border-color:#4a303b;
      box-shadow:0 12px 26px rgba(0,0,0,.24);
    }
    body.dark-mode .label,
    body.dark-mode .pill,
    body.dark-mode .back-link,
    body.dark-mode .draft-btn,
    body.dark-mode .upload-label span{
      background:#3a2430;
      color:#ff8fb1;
      border-color:#5b3747;
    }
    body.dark-mode h2,
    body.dark-mode .section-title,
    body.dark-mode .paper-title-input{
      color:#fff6fa;
    }
    body.dark-mode .sub,
    body.dark-mode .draft-state,
    body.dark-mode .helper,
    body.dark-mode .paper-label span:last-child,
    body.dark-mode .bottom-menu a{
      color:#c9aeb9;
    }
    body.dark-mode .category-option span,
    body.dark-mode .upload-label,
    body.dark-mode .preview-item,
    body.dark-mode .loading-box{
      background:#2f2028;
      border-color:#4a303b;
      color:#f5e8ee;
    }
    body.dark-mode .category-option input:checked + span,
    body.dark-mode .post-btn{
      background:#ff5c8a;
      color:#fff;
      border-color:#ff5c8a;
    }
    body.dark-mode .paper-divider,
    body.dark-mode .paper-counts,
    body.dark-mode .bottom-inner{
      border-color:#4a303b;
    }
    body.dark-mode .paper-counts{
      background:#2b1e25;
      color:#c9aeb9;
    }
    body.dark-mode .paper-count-right{color:#c9aeb9;}
    body.dark-mode .paper-content-input,
    body.dark-mode .story-content{
      color:#f5e8ee;
    }
    body.dark-mode .paper-title-input::placeholder,
    body.dark-mode .paper-content-input::placeholder{
      color:#bfa5b0;
    }
    body.dark-mode .bottom-inner{
      background:rgba(28,20,25,.96);
      box-shadow:0 18px 42px rgba(0,0,0,.34);
    }
    body.dark-mode .menu-item,
    body.dark-mode .menu-icon{
      color:#c9aeb9;
    }
    body.dark-mode .menu-item.active,
    body.dark-mode .menu-item.active .menu-icon{
      color:#ff8fb1;
    }
    body.dark-mode .menu-item.active .menu-icon{
      background:linear-gradient(135deg,#3a2430,#553144);
      box-shadow:0 10px 24px rgba(0,0,0,.22);
    }
    body.dark-mode .notification-badge{border-color:#1c1419;}

    @media(max-width:390px){
      .container{padding-left:11px;padding-right:11px;}
      .card{padding:16px 13px 17px;border-radius:23px;}
      h2{font-size:21px;}
      .category-box{gap:6px;}
      .category-option span{min-height:61px;font-size:10.3px;border-radius:16px;}
      .category-option b{font-size:18px;}
      .paper-title-input{font-size:18px;}
      .paper-content-input{min-height:180px;}
      .button-row{grid-template-columns:1fr;}
    }
  </style>
</head>

<body>
<div class="header">
  <div class="header-inner">

<!-- 로고 -->
<div class="brand">
  <span class="mini-logo"></span>
  오늘도육아
</div>

<!-- 오른쪽 버튼 -->
<div
  class="header-actions"
  style="display:flex; gap:8px; align-items:center; justify-content:flex-end;"
>

  <!-- 야간모드 -->
  <button
    class="pill dark-mode-toggle"
    data-mode="icon"
    onclick="toggleDarkMode()"
    type="button"
  >
    🌙
  </button>

  <!-- 홈으로 -->
  <a href="home.html" class="pill back-link">
    홈으로
  </a>

</div>

  </div>
</div>

  <div class="container">
    <div class="card">

      <div class="label">TODAY WRITE</div>

      <h2>
        오늘의 육아 이야기를<br>
        편하게 남겨주세요
      </h2>

      <p class="sub">
        고민도, 자랑도, 위로받고 싶은 마음도 괜찮아요.
      </p>

      <div class="section-title">
        <span>카테고리 선택</span>
        <span class="draft-state" id="draftState">자동 임시저장</span>
      </div>

      <div class="category-box">

        <label class="category-option">
          <input type="radio" name="category" value="출산준비" checked>
          <span>
            <b>🤰</b>
            출산준비
          </span>
        </label>

        <label class="category-option">
          <input type="radio" name="category" value="새벽육아">
          <span>
            <b>🌙</b>
            새벽육아
          </span>
        </label>

        <label class="category-option">
          <input type="radio" name="category" value="신생아">
          <span>
            <b>🍼</b>
            신생아
          </span>
        </label>

        <label class="category-option">
          <input type="radio" name="category" value="영유아">
          <span>
            <b>🧸</b>
            영유아
          </span>
        </label>

        <label class="category-option">
          <input type="radio" name="category" value="어린이">
          <span>
            <b>🧒</b>
            어린이
          </span>
        </label>



      </div>

      <div class="writing-paper">
        <div class="paper-head">
          <div class="paper-label">
            <span>💗 오늘 남기고 싶은 이야기</span>
            <span>짧아도 괜찮아요</span>
          </div>

          <input
            type="text"
            id="title"
            class="paper-title-input"
            maxlength="40"
            placeholder="오늘 어떤 마음을 나누고 싶나요?"
          >
        </div>

        <div class="paper-divider"></div>

        <div class="paper-body">
          <textarea
            id="content"
            class="paper-content-input"
            maxlength="1000"
            placeholder="여기에 편하게 적어주세요.
힘들었던 순간도, 귀여웠던 순간도, 그냥 털어놓고 싶은 마음도 괜찮아요."
          ></textarea>
        </div>

        <div class="paper-counts" id="titleCountRow">
          <span id="contentCountRow">따뜻한 말투로 남겨주세요</span>
          <div class="paper-count-right">
            <span id="titleCount">0 / 40</span>
            <span id="contentCount">0 / 1000</span>
          </div>
        </div>
      </div>

      <div class="upload-box">
        <label for="imageInput" class="upload-label">
          <span>＋</span>
          사진 추가하기
        </label>

        <input type="file" id="imageInput" accept="image/*" multiple>

        <div class="preview-grid" id="previewGrid"></div>

        <div class="helper">
          사진은 최대 3장까지 올릴 수 있어요.
        </div>
      </div>

      <div class="button-row">
        <button class="draft-btn" id="saveDraftBtn" type="button">
          임시저장
        </button>

        <button class="post-btn" id="postBtn" type="button">
          고민 공유하기
        </button>
      </div>

      <div class="loading-box" id="loadingBox">
        게시글을 등록하고 있어요...
      </div>

    </div>
  </div>

  <div class="bottom-menu">
    <div class="bottom-inner">
      <a href="home.html" class="menu-item" aria-label="홈">
        <div class="menu-icon home-icon" >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.5 11.2 12 4l8.5 7.2"></path>
            <path d="M5.7 10.4v8.3c0 .8.6 1.4 1.4 1.4h3.1v-5.4h3.6v5.4h3.1c.8 0 1.4-.6 1.4-1.4v-8.3"></path>
          </svg>
        </div>
        <span>홈</span>
      </a>

      <a href="write.html" class="menu-item active" aria-label="글쓰기">
        <div class="menu-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 20h4.6L19.2 9.4a2.4 2.4 0 0 0 0-3.4L18 4.8a2.4 2.4 0 0 0-3.4 0L4 15.4V20z"></path>
            <path d="M13.7 5.7l4.6 4.6"></path>
            <path d="M4 15.4 8.6 20"></path>
          </svg>
        </div>
        <span>글쓰기</span>
      </a>

      <a href="notifications.html" class="menu-item notification-link" aria-label="알림">
        <div class="menu-icon notification-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18.2 9.8a6.2 6.2 0 0 0-12.4 0c0 7-2.4 7.7-2.4 7.7h17.2s-2.4-.7-2.4-7.7z"></path>
            <path d="M9.8 20.1a2.6 2.6 0 0 0 4.4 0"></path>
          </svg>
          <span id="notificationBadge" class="notification-badge"></span>
        </div>
        <span>알림</span>
      </a>

      <a href="profile.html" class="menu-item" aria-label="내정보">
        <div class="menu-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 12.3a4.2 4.2 0 1 0 0-8.4 4.2 4.2 0 0 0 0 8.4z"></path>
            <path d="M4.4 20.2c1.2-3.5 4-5.3 7.6-5.3s6.4 1.8 7.6 5.3"></path>
          </svg>
        </div>
        <span>내정보</span>
      </a>
    </div>
  </div>

  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      doc,
      getDoc,
      query,
      where,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    import {
      getStorage,
      ref,
      uploadBytes,
      getDownloadURL
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD4x9d4aQlbroxcnT2v-zHODDPdQabIFx0",
      authDomain: "today-parenting-app.firebaseapp.com",
      projectId: "today-parenting-app",
      storageBucket: "today-parenting-app.firebasestorage.app",
      messagingSenderId: "375329953167",
      appId: "1:375329953167:web:d29af0e45cc7d10e9f67fa"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const postBtn = document.getElementById("postBtn");
    const saveDraftBtn = document.getElementById("saveDraftBtn");
    const title = document.getElementById("title");
    const content = document.getElementById("content");
    const imageInput = document.getElementById("imageInput");
    const previewGrid = document.getElementById("previewGrid");
    const loadingBox = document.getElementById("loadingBox");
    const draftState = document.getElementById("draftState");
    const titleCount = document.getElementById("titleCount");
    const contentCount = document.getElementById("contentCount");
    const titleCountRow = document.getElementById("titleCountRow");
    const contentCountRow = document.getElementById("contentCountRow");

    let currentUser = null;
    let currentNickname = "익명";
    let selectedFiles = [];
    let notificationBadgeUnsubscribe = null;

    const DRAFT_KEY = "todayParentingWriteDraft";

    const params = new URLSearchParams(window.location.search);
    const categoryFromUrl = params.get("category");



    function startNotificationBadge(uid){
      const badge = document.getElementById("notificationBadge");

      if(!badge || !uid){
        return;
      }

      if(notificationBadgeUnsubscribe){
        notificationBadgeUnsubscribe();
      }

      const badgeQuery = query(
        collection(db, "notifications"),
        where("receiverId", "==", uid),
        where("isRead", "==", false)
      );

      notificationBadgeUnsubscribe = onSnapshot(badgeQuery, (snapshot) => {
        const count = snapshot.size;

        if(count > 0){
          badge.innerText = count > 99 ? "99+" : count;
          badge.style.display = "inline-block";
        } else {
          badge.innerText = "";
          badge.style.display = "none";
        }
      }, (error) => {
        console.log("알림 뱃지 오류:", error.message);
      });
    }

    function getSelectedCategory(){
      const checkedCategory = document.querySelector("input[name='category']:checked");
      return checkedCategory ? checkedCategory.value : "출산준비";
    }

    function setCategory(category){
      const target = document.querySelector(`input[name='category'][value="${category}"]`);

      if(target){
        target.checked = true;
      }
    }

    function updateCounts(){
      titleCount.innerText = `${title.value.length} / 40`;
      contentCount.innerText = `${content.value.length} / 1000`;

      titleCountRow.classList.toggle("warning", title.value.length >= 35);
      contentCountRow.classList.toggle("warning", content.value.length >= 900);
    }

    function saveDraft(silent = false){
      const draft = {
        category: getSelectedCategory(),
        title: title.value,
        content: content.value,
        savedAt: new Date().toISOString()
      };

      localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));

      draftState.innerText = "임시저장 완료";

      if(!silent){
        alert("임시저장 되었어요.");
      }

      setTimeout(() => {
        draftState.innerText = "자동 임시저장";
      }, 1500);
    }

    function loadDraft(){
      const saved = localStorage.getItem(DRAFT_KEY);

      if(!saved){
        if(categoryFromUrl){
          setCategory(categoryFromUrl);
        }

        updateCounts();
        return;
      }

      try{
        const draft = JSON.parse(saved);

        if(draft.category){
          setCategory(categoryFromUrl || draft.category);
        }

        title.value = draft.title || "";
        content.value = draft.content || "";

        updateCounts();

      } catch(error){
        localStorage.removeItem(DRAFT_KEY);
      }
    }

    function clearDraft(){
      localStorage.removeItem(DRAFT_KEY);
    }

    function renderPreview(){
      previewGrid.innerHTML = "";

      if(selectedFiles.length === 0){
        previewGrid.style.display = "none";
        return;
      }

      previewGrid.style.display = "grid";

      selectedFiles.forEach((file, index) => {
        const imageUrl = URL.createObjectURL(file);

        const item = document.createElement("div");
        item.className = "preview-item";

        item.innerHTML = `
          <img src="${imageUrl}" alt="미리보기 이미지">
          <button class="remove-image" type="button" data-index="${index}">×</button>
        `;

        previewGrid.appendChild(item);
      });

      document.querySelectorAll(".remove-image").forEach((btn) => {
        btn.addEventListener("click", () => {
          const index = Number(btn.dataset.index);
          selectedFiles.splice(index, 1);
          renderPreview();
        });
      });
    }


    function compressImage(file, maxWidth = 1200, maxHeight = 1200, quality = 0.75){
      return new Promise((resolve, reject) => {
        if(!file || !file.type.startsWith("image/")){
          resolve(file);
          return;
        }

        const reader = new FileReader();

        reader.onload = (event) => {
          const img = new Image();

          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if(width > maxWidth || height > maxHeight){
              const ratio = Math.min(maxWidth / width, maxHeight / height);
              width = Math.round(width * ratio);
              height = Math.round(height * ratio);
            }

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext("2d");

            if(!ctx){
              resolve(file);
              return;
            }

            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob((blob) => {
              if(!blob){
                resolve(file);
                return;
              }

              const originalName = file.name || "image";
              const nameWithoutExt = originalName.replace(/\.[^/.]+$/, "");
              const compressedName = nameWithoutExt + ".jpg";

              const compressedFile = new File(
                [blob],
                compressedName,
                {
                  type: "image/jpeg",
                  lastModified: Date.now()
                }
              );

              resolve(compressedFile);
            }, "image/jpeg", quality);
          };

          img.onerror = () => {
            reject(new Error("이미지를 압축하지 못했어요."));
          };

          img.src = event.target.result;
        };

        reader.onerror = () => {
          reject(new Error("이미지를 읽지 못했어요."));
        };

        reader.readAsDataURL(file);
      });
    }

    imageInput.addEventListener("change", () => {
      const files = Array.from(imageInput.files || []);

      const imageFiles = files.filter((file) => file.type.startsWith("image/"));

      selectedFiles = imageFiles.slice(0, 3);

      if(files.length > 3){
        alert("사진은 최대 3장까지만 올릴 수 있어요.");
      }

      renderPreview();
      imageInput.value = "";
    });

    title.addEventListener("input", () => {
      updateCounts();
      saveDraft(true);
    });

    content.addEventListener("input", () => {
      updateCounts();
      saveDraft(true);
    });

    document.querySelectorAll("input[name='category']").forEach((radio) => {
      radio.addEventListener("change", () => {
        saveDraft(true);
      });
    });

    saveDraftBtn.addEventListener("click", () => {
      saveDraft(false);
    });

    onAuthStateChanged(auth, async (user) => {
      if(user){
        currentUser = user;
        startNotificationBadge(user.uid);

        try{
          const userDoc = await getDoc(doc(db, "users", user.uid));

          if(userDoc.exists()){
            currentNickname = userDoc.data().nickname || user.displayName || "익명";
          } else {
            currentNickname = user.displayName || user.email || "익명";
          }

          loadDraft();

        } catch(error){
          currentNickname = user.displayName || user.email || "익명";
          loadDraft();
        }

      } else {
        alert("로그인이 필요합니다.");
        window.location.href = "index.html";
      }
    });

    postBtn.addEventListener("click", async () => {
      const categoryValue = getSelectedCategory();
      const titleValue = title.value.trim();
      const contentValue = content.value.trim();

      if(!currentUser){
        alert("로그인이 필요합니다.");
        return;
      }

      if(titleValue === ""){
        alert("제목을 입력해주세요.");
        title.focus();
        return;
      }

      if(titleValue.length < 2){
        alert("제목은 2글자 이상 입력해주세요.");
        title.focus();
        return;
      }

      if(contentValue === ""){
        alert("내용을 입력해주세요.");
        content.focus();
        return;
      }

      if(contentValue.length < 5){
        alert("내용은 5글자 이상 입력해주세요.");
        content.focus();
        return;
      }

      try{
        postBtn.disabled = true;
        saveDraftBtn.disabled = true;
        postBtn.innerText = "등록 중...";
        loadingBox.classList.add("active");

        let imageUrls = [];

        for(const file of selectedFiles){
          const compressedFile = await compressImage(file);
          const safeFileName = compressedFile.name.replaceAll(" ", "_");

          const imageRef = ref(
            storage,
            "postImages/" + currentUser.uid + "/" + Date.now() + "_" + safeFileName
          );

          await uploadBytes(imageRef, compressedFile, {
            contentType: compressedFile.type || "image/jpeg"
          });

          const downloadURL = await getDownloadURL(imageRef);

          imageUrls.push(downloadURL);
        }

        await addDoc(collection(db, "posts"), {
          category: categoryValue,
          title: titleValue,
          content: contentValue,
          imageUrl: imageUrls[0] || "",
          imageUrls: imageUrls,
          nickname: currentNickname,
          userId: currentUser.uid,
          likes: 0,
          views: 0,
          commentCount: 0,
          likedBy: [],
          viewedBy: [],
          createdAt: new Date(),
          updatedAt: new Date()
        });

        clearDraft();

        alert("게시글 등록 완료 💕");

        window.location.href =
          "home.html?category=" + encodeURIComponent(categoryValue);

      } catch(error){
        alert("등록 실패: " + error.message);

        postBtn.disabled = false;
        saveDraftBtn.disabled = false;
        postBtn.innerText = "고민 공유하기";
        loadingBox.classList.remove("active");
      }
    });

  </script>

<script src="theme.js"></script>

</body>
</html>
