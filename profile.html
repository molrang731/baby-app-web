<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>내정보 - 오늘도육아</title>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

    :root{
      --bg:#fff7fb;--text:#241f21;--sub:#5f5357;--muted:#8d7c83;
      --card:#fff;--header:rgba(255,255,255,.94);--line:#f3dfe7;
      --soft:#fff7fa;--soft2:#fff0f5;--point:#ff5c8a;--point2:#ffd6e7;
      --shadow:rgba(255,92,138,.08);--input:#fff7fa;--bottom:rgba(255,255,255,.97);
    }
    body.dark-mode{
      --bg:#181216;--text:#fff6fa;--sub:#eadbe2;--muted:#c9aeb9;
      --card:#261b22;--header:rgba(28,20,25,.94);--line:#4a303b;
      --soft:#2f2028;--soft2:#3a2430;--point:#ff8fb1;--point2:#5b3747;
      --shadow:rgba(0,0,0,.24);--input:#2f2028;--bottom:rgba(34,24,30,.96);
    }

    html,body{width:100%;min-height:100%;}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;
      background:var(--bg);color:var(--text);padding-bottom:112px;overflow-x:hidden;
    }
    button,input,textarea{font-family:inherit;}
    button{cursor:pointer;}

    .header{position:sticky;top:0;z-index:100;background:var(--header);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line);box-shadow:0 4px 18px var(--shadow);}
    .header-inner{width:100%;max-width:430px;margin:0 auto;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
    .brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:900;color:var(--point);letter-spacing:-.7px;white-space:nowrap;}
    .mini-logo{width:19px;height:19px;border-radius:50%;background:var(--point);position:relative;display:inline-block;flex-shrink:0;}
    .mini-logo::after{content:'';position:absolute;width:19px;height:19px;border-radius:50%;background:var(--bg);top:-2px;left:7px;}
    .header-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
    .pill{height:38px;padding:0 12px;border-radius:999px;display:flex;align-items:center;justify-content:center;text-decoration:none;background:var(--card);color:var(--point);border:1px solid var(--point2);box-shadow:0 8px 20px var(--shadow);font-size:12px;font-weight:900;white-space:nowrap;}
    .dark-mode-toggle{min-width:38px;padding:0 10px;font-size:17px;border:none;}

    .container{width:100%;max-width:430px;margin:0 auto;padding:14px 13px 22px;}
    .profile-hero,.activity-card,.edit-card{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 10px 24px var(--shadow);margin-bottom:14px;}

    .cover{height:96px;background:linear-gradient(135deg,#ff8fb1,var(--point2));position:relative;}
    body.dark-mode .cover{background:linear-gradient(135deg,#4a2635,#6b3449);}
    .cover-label,.visibility-badge{position:absolute;top:14px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.82);color:var(--point);border:1px solid rgba(255,255,255,.35);font-size:11.5px;font-weight:900;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
    body.dark-mode .cover-label,body.dark-mode .visibility-badge{background:rgba(58,36,48,.88);}
    .cover-label{left:14px;}.visibility-badge{right:14px;}

    .profile-main{padding:0 15px 16px;text-align:center;margin-top:-38px;position:relative;z-index:2;}
    .profile-photo-wrap{width:96px;height:96px;margin:0 auto 11px;position:relative;}
    .profile-photo{width:96px;height:96px;border-radius:34px;background:linear-gradient(135deg,var(--soft2),var(--point2));display:flex;align-items:center;justify-content:center;color:var(--point);font-size:36px;font-weight:900;overflow:hidden;border:5px solid var(--card);box-shadow:0 14px 30px var(--shadow);}
    .profile-photo img,.mini-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
    .photo-btn{position:absolute;right:-3px;bottom:-3px;width:36px;height:36px;border-radius:50%;background:var(--point);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;cursor:pointer;border:3px solid var(--card);box-shadow:0 8px 18px var(--shadow);}
    #photoInput{display:none;}
    .nickname{font-size:24px;font-weight:900;letter-spacing:-.8px;margin-bottom:7px;color:var(--text);word-break:keep-all;overflow-wrap:anywhere;}
    .stage{display:inline-flex;align-items:center;gap:5px;background:var(--soft2);color:var(--point);border:1px solid var(--point2);padding:8px 13px;border-radius:999px;font-size:13px;font-weight:900;margin-bottom:13px;}
    .status{color:var(--sub);line-height:1.65;font-size:14px;background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:13px;text-align:left;white-space:pre-line;margin-bottom:14px;word-break:break-word;}

    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:13px;}
    .stat{background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:12px 4px;text-align:center;}
    .stat strong{display:block;color:var(--text);font-size:21px;margin-bottom:4px;letter-spacing:-.5px;}
    .stat span{color:var(--muted);font-size:11.5px;font-weight:900;}
    .quick-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
    .quick-btn{padding:13px 10px;border-radius:18px;background:var(--soft2);color:var(--point);border:1px solid var(--point2);text-decoration:none;font-size:13px;font-weight:900;}

    .activity-card,.edit-card{padding:16px 15px;}
    .edit-title{font-size:18px;font-weight:900;margin-bottom:5px;color:var(--text);letter-spacing:-.5px;}
    .edit-sub{color:var(--muted);font-size:13px;line-height:1.5;margin-bottom:12px;}
    .section-title{color:var(--text);font-size:14px;font-weight:900;margin:12px 0 8px;}

    .visibility-box,.stage-edit-box{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:13px 0 15px;}
    .visibility-option input,.stage-option input{display:none;}
    .visibility-option span,.stage-option span{min-height:54px;border-radius:17px;background:var(--soft);border:1px solid var(--line);color:var(--muted);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;font-size:13px;font-weight:900;cursor:pointer;text-align:center;}
    .visibility-option small{font-size:11px;color:var(--muted);font-weight:800;}
    .visibility-option input:checked + span,.stage-option input:checked + span{background:var(--point);color:#fff;border-color:var(--point);box-shadow:0 10px 22px rgba(255,92,138,.18);}
    .visibility-option input:checked + span small{color:#fff;opacity:.9;}

    .tab-row{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:var(--soft);padding:5px;border-radius:999px;border:1px solid var(--line);margin:13px 0;}
    .tab-btn{width:100%;padding:10px 4px;border:none;border-radius:999px;background:transparent;color:var(--muted);font-size:12px;font-weight:900;white-space:nowrap;}
    .tab-btn.active{background:var(--point);color:#fff;box-shadow:0 8px 18px rgba(255,92,138,.18);}

    .mini-post-list{display:flex;flex-direction:column;gap:9px;}
    .mini-post{display:flex;gap:10px;background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:10px;cursor:pointer;}
    .mini-thumb{width:62px;height:62px;border-radius:16px;background:linear-gradient(135deg,var(--soft2),var(--point2));flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--point);font-size:23px;font-weight:900;}
    .mini-info{min-width:0;flex:1;}
    .mini-category{display:inline-block;color:var(--point);background:var(--card);border:1px solid var(--point2);padding:4px 8px;border-radius:999px;font-size:10.5px;font-weight:900;margin-bottom:5px;}
    .mini-title{font-size:13.8px;font-weight:900;color:var(--text);line-height:1.35;margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .mini-meta{color:var(--muted);font-size:11.2px;font-weight:800;display:flex;gap:7px;flex-wrap:wrap;}

    textarea{width:100%;height:104px;resize:none;outline:none;background:var(--input);border:1px solid var(--line);border-radius:18px;padding:14px;font-size:14px;line-height:1.65;color:var(--text);margin-bottom:9px;}
    textarea:focus{background:var(--card);border-color:var(--point);box-shadow:0 0 0 4px rgba(255,92,138,.08);}
    .main-btn,.more-btn{width:100%;border-radius:18px;font-weight:900;cursor:pointer;}
    .main-btn{padding:14px;border:none;background:var(--point);color:#fff;font-size:15px;margin-top:8px;box-shadow:0 10px 22px rgba(255,92,138,.18);}
    .logout-btn{background:#f2edf0;color:#6d5f64;box-shadow:none;}
    body.dark-mode .logout-btn{background:#30242b;color:#ffc1d5;border:1px solid var(--point2);}
    .more-btn{margin-top:11px;background:var(--card);color:var(--point);border:1px solid var(--point2);box-shadow:0 8px 18px var(--shadow);font-size:13px;padding:12px;}
    .empty{background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:22px 14px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7;}
    .private-note{display:none;background:var(--soft2);border:1px solid var(--point2);color:var(--point);border-radius:18px;padding:12px;font-size:13px;font-weight:900;line-height:1.5;margin-bottom:12px;}
    .private-note.active{display:block;}

    .bottom-menu{position:fixed;left:0;bottom:14px;width:100%;z-index:999;padding:0 14px env(safe-area-inset-bottom);pointer-events:none;}
    .bottom-inner{width:100%;max-width:430px;height:78px;margin:0 auto;display:flex;justify-content:space-around;align-items:center;background:var(--bottom);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:30px;box-shadow:0 14px 34px var(--shadow);pointer-events:auto;}
    .bottom-menu a,.menu-item{width:25%;height:100%;text-decoration:none;color:#7d6c72;font-size:12px;text-align:center;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;transition:.18s ease;}
    .menu-icon{width:45px;height:45px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:currentColor;position:relative;transition:.18s ease;}
    .menu-icon svg{width:26px;height:26px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;display:block;}
    .bottom-menu a.active,.menu-item.active{color:var(--point);}
    .bottom-menu a.active .menu-icon,.menu-item.active .menu-icon{background:var(--soft2);box-shadow:0 8px 18px var(--shadow);transform:translateY(-2px);}
    .menu-icon.home-icon::after{content:'❤';position:absolute;top:-6px;right:1px;width:17px;height:17px;border-radius:50%;background:#ff8fb1;color:#fff;font-size:10px;line-height:17px;text-align:center;box-shadow:0 5px 12px rgba(255,92,138,.22);}
    .menu-item span{line-height:1;letter-spacing:-.35px;}
    .notification-link,.notification-icon{position:relative;}
    .notification-badge{position:absolute;top:-6px;right:-7px;min-width:18px;height:18px;padding:0 5px;background:#ff2f6d;color:#fff;border-radius:999px;font-size:10px;font-weight:900;line-height:18px;text-align:center;display:none;box-shadow:0 4px 10px rgba(255,47,109,.35);border:2px solid var(--card);}
    body.dark-mode .bottom-menu a,body.dark-mode .menu-item,body.dark-mode .menu-icon{color:#c9aeb9;}
    body.dark-mode .bottom-menu a.active,body.dark-mode .menu-item.active,body.dark-mode .menu-item.active .menu-icon{color:var(--point);}

    .main-btn:active,.more-btn:active,.tab-btn:active,.pill:active,.quick-btn:active,.mini-post:active{transform:scale(.99);}

    @media(max-width:390px){
      .container{padding-left:11px;padding-right:11px;}.header-inner{padding-left:16px;padding-right:16px;}
      .brand{font-size:20px;}.nickname{font-size:23px;}.stat strong{font-size:20px;}.stat span{font-size:11px;}
      .tab-btn{font-size:11.3px;}.activity-card,.edit-card{padding-left:14px;padding-right:14px;}
      .mini-title{font-size:13.3px;}.bottom-menu{padding-left:12px;padding-right:12px;}
    }
  </style>
</head>

<body>

  <script>
  const savedTheme =
    localStorage.getItem("todayParentingTheme") ||
    localStorage.getItem("theme") ||
    localStorage.getItem("colorTheme");

  if(savedTheme === "dark"){
    document.body.classList.add("dark-mode");
  }
</script>

  <div class="header">
    <div class="header-inner">
      <div class="brand">
        <span class="mini-logo"></span>
        오늘도육아
      </div>

      <div class="header-actions">
        <button class="pill dark-mode-toggle" id="themeToggle" type="button" aria-label="야간모드 전환">🌙</button>
        <a href="home.html" class="pill">마이홈</a>
      </div>
    </div>
  </div>

  <div class="container">

    <div class="profile-hero">
      <div class="cover">
        <div class="cover-label">TODAY PROFILE</div>
        <div class="visibility-badge" id="visibilityBadge">공개</div>
      </div>

      <div class="profile-main">
        <div class="profile-photo-wrap">
          <div class="profile-photo" id="profilePhoto">?</div>

        <div class="nickname" id="nickname">불러오는 중...</div>

        <div class="stats">
          <div class="stat">
            <strong id="postCount">0</strong>
            <span>작성글</span>
          </div>

          <div class="stat">
            <strong id="likeCount">0</strong>
            <span>받은공감</span>
          </div>

          <div class="stat">
            <strong id="likedCount">0</strong>
            <span>공감한글</span>
          </div>
        </div>

        <div class="quick-row">
          <a href="write.html" class="quick-btn">✎ 글쓰기</a>
          <a href="home.html" class="quick-btn">⌂ 홈으로</a>
        </div>
      </div>
    </div>

    <div class="activity-card">
      <div class="edit-title">공개 설정</div>
      <div class="edit-sub">내 활동을 다른 사람에게 보여줄지 선택할 수 있어요.</div>

      <div class="visibility-box">
        <label class="visibility-option">
          <input type="radio" name="profileVisibility" value="public" checked>

            🌷 공개
            <small>활동을 보여줘요</small>
          </span>
        </label>

        <label class="visibility-option">
          <input type="radio" name="profileVisibility" value="private">
          <span>
            🔒 비공개
            <small>나만 볼 수 있어요</small>
          </span>
        </label>
      </div>

      <button class="main-btn" id="saveVisibilityBtn" type="button">공개 설정 저장</button>
    </div>

    <div class="activity-card">
      <div class="edit-title">내 활동</div>
      <div class="edit-sub">내가 작성한 글과 공감한 글을 모아볼 수 있어요.</div>

      <div class="private-note" id="privateNote">
        🔒 현재 비공개 상태예요. 이 활동은 나에게만 보여요.
      </div>

      <div class="tab-row">
        <button class="tab-btn active" id="myPostsTab" type="button">작성글</button>
        <button class="tab-btn" id="receivedLikesTab" type="button">받은공감</button>
        <button class="tab-btn" id="likedPostsTab" type="button">공감한글</button>
      </div>

      <div class="mini-post-list" id="activityList">
        <div class="empty">활동을 불러오는 중이에요.</div>
      </div>
    </div>

    <div class="edit-card">
      <div class="edit-title">내 소개 수정</div>
      <div class="edit-sub">오늘의 마음이나 내 육아 상태를 짧게 남겨보세요.</div>

      <div class="section-title">육아 단계 수정</div>

      <div class="stage-edit-box">
        <label class="stage-option">
          <input type="radio" name="editStage" value="예비부모">
          <span>🤰 예비부모</span>
        </label>

        <label class="stage-option">
          <input type="radio" name="editStage" value="신생아">
          <span>🍼 신생아</span>
        </label>

        <label class="stage-option">
          <input type="radio" name="editStage" value="영유아">
          <span>🧸 영유아</span>
        </label>

        <label class="stage-option">
          <input type="radio" name="editStage" value="어린이">
          <span>🧒 어린이</span>
        </label>
      </div>

      <textarea id="statusInput" placeholder="예: 오늘도 새벽수유 완료... ☕"></textarea>

      <button class="main-btn" id="saveStatusBtn" type="button">소개 저장하기</button>
      <button class="main-btn logout-btn" id="logoutBtn" type="button">로그아웃</button>
    </div>

  </div>

  <div class="bottom-menu">
    <div class="bottom-inner">
      <a href="home.html" class="menu-item" aria-label="홈">
        <div class="menu-icon home-icon">

        <div class="menu-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

    const auth = getAuth(app);

    const profilePhoto = document.getElementById("profilePhoto");

    const themeToggle = document.getElementById("themeToggle");

    let currentUser = null;
    let currentNickname = "사용자";
    let notificationBadgeUnsubscribe = null;
    let currentStage = "육아 중";
    let currentPhotoURL = "";
    let profileVisibility = "public";
    let myPosts = [];
    let receivedLikePosts = [];
    let likedPosts = [];
    let currentTab = "myPosts";
    let activityVisibleCount = 8;

    initTheme();

    onAuthStateChanged(auth, async (user) => {
      if(!user){
        alert("로그인이 필요합니다.");
        window.location.href = "index.html";
        return;
      }

      currentUser = user;
      startNotificationBadge(user.uid);

      await loadProfile();
      await loadActivities();
      loadStats();
      renderActivityList();
    });

    function initTheme(){
      const savedTheme =
        localStorage.getItem("theme") ||
        localStorage.getItem("colorTheme") ||
        localStorage.getItem("todayParentingTheme");

      const isDark = savedTheme === "dark";
      document.body.classList.toggle("dark-mode", isDark);
      updateThemeIcon(isDark);

      themeToggle.addEventListener("click", () => {
        const nextDark = !document.body.classList.contains("dark-mode");

        document.body.classList.toggle("dark-mode", nextDark);

        localStorage.setItem("theme", nextDark ? "dark" : "light");
        localStorage.setItem("colorTheme", nextDark ? "dark" : "light");
        localStorage.setItem("todayParentingTheme", nextDark ? "dark" : "light");

        updateThemeIcon(nextDark);
      });
    }

    function updateThemeIcon(isDark){
      themeToggle.innerText = isDark ? "☀️" : "🌙";
      themeToggle.setAttribute("aria-label", isDark ? "주간모드 전환" : "야간모드 전환");
    }

    function startNotificationBadge(uid){
      if(!notificationBadge || !uid){
        return;
      }

      if(notificationBadgeUnsubscribe){
        notificationBadgeUnsubscribe();
      }

      const badgeQuery = query(
        collection(db, "notifications"),
        where("receiverId", "==", uid),
        where("isRead", "==", false)
      );

      notificationBadgeUnsubscribe = onSnapshot(badgeQuery, (snapshot) => {
        const count = snapshot.size;

        if(count > 0){
          notificationBadge.style.display = "flex";
          notificationBadge.innerText = count > 99 ? "99+" : count;
        } else {
          notificationBadge.style.display = "none";
          notificationBadge.innerText = "";
        }
      }, (error) => {
        console.log("알림 뱃지 오류:", error.message);
      });
    }

    function escapeHTML(text){
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getPostDate(createdAt){
      if(!createdAt){
        return new Date(0);
      }

      if(createdAt.toDate){
        return createdAt.toDate();
      }

      return new Date(createdAt);
    }

    function getTimeText(createdAt){
      const postDate = getPostDate(createdAt);

      if(postDate.getTime() === 0){
        return "방금 전";
      }

      const now = new Date();
      const diff = now - postDate;

      const minute = 60 * 1000;
      const hour = 60 * minute;
      const day = 24 * hour;

      if(diff < minute){
        return "방금 전";
      }

      if(diff < hour){
        return Math.floor(diff / minute) + "분 전";
      }

      if(diff < day){
        return Math.floor(diff / hour) + "시간 전";
      }

      if(diff < day * 7){
        return Math.floor(diff / day) + "일 전";
      }

      return postDate.getFullYear() + "." +
        String(postDate.getMonth() + 1).padStart(2, "0") + "." +
        String(postDate.getDate()).padStart(2, "0");
    }

    function getPostImages(post){
      if(Array.isArray(post.imageUrls) && post.imageUrls.length > 0){
        return post.imageUrls.filter((url) => url);
      }

      if(post.imageUrl){
        return [post.imageUrl];
      }

      return [];
    }

    function getThumbHtml(post){
      const images = getPostImages(post);

      if(images.length > 0){
        return `<img src="${escapeHTML(images[0])}" alt="게시글 이미지">`;
      }

      return "💬";
    }

    async function loadProfile(){
      try{
        const userRef = doc(db, "users", currentUser.uid);
        const userDoc = await getDoc(userRef);

        if(userDoc.exists()){
          const data = userDoc.data();

          currentNickname = data.nickname || currentUser.displayName || currentUser.email || "사용자";
          currentStage = data.stage || "육아 중";
          currentPhotoURL = data.photoURL || data.photoUrl || "";
          profileVisibility = data.profileVisibility || "public";

          nicknameEl.innerText = currentNickname;
          stageBadge.innerText = "🌷 " + currentStage + " 부모";
          renderStageEdit();

          if(data.status && data.status.trim() !== ""){
            statusText.innerText = data.status;
            statusInput.value = data.status;
          } else {
            statusText.innerText = "상태메시지가 아직 없어요.";
          }

          renderPhoto();
          renderVisibility();

        } else {
          currentNickname = currentUser.displayName || currentUser.email || "사용자";

          await setDoc(userRef, {
            nickname: currentNickname,
            email: currentUser.email || "",
            stage: currentStage,
            photoURL: "",
            status: "",
            profileVisibility: "public",
            createdAt: new Date()
          }, { merge:true });

          nicknameEl.innerText = currentNickname;
          stageBadge.innerText = "🌷 " + currentStage + " 부모";
          renderStageEdit();
          renderPhoto();
          renderVisibility();
        }

      } catch(error){
        alert("프로필을 불러오지 못했어요: " + error.message);
      }
    }

    function renderPhoto(){
      if(currentPhotoURL){
        profilePhoto.innerHTML = `<img src="${escapeHTML(currentPhotoURL)}" alt="프로필 사진">`;
      } else {
        profilePhoto.innerText = currentNickname ? currentNickname.charAt(0) : "?";
      }
    }

    function renderStageEdit(){
      const target = document.querySelector(`input[name="editStage"][value="${currentStage}"]`);

      if(target){
        target.checked = true;
      }
    }

    function renderVisibility(){
      const target = document.querySelector(`input[name="profileVisibility"][value="${profileVisibility}"]`);

      if(target){
        target.checked = true;
      }

      if(profileVisibility === "private"){
        visibilityBadge.innerText = "비공개";
        privateNote.classList.add("active");
      } else {
        visibilityBadge.innerText = "공개";
        privateNote.classList.remove("active");
      }
    }

    async function loadActivities(){
      try{
        const myPostsQuery = query(
          collection(db, "posts"),
          where("userId", "==", currentUser.uid),
          orderBy("createdAt", "desc")
        );

        const myPostsSnapshot = await getDocs(myPostsQuery);

        myPosts = [];

        myPostsSnapshot.forEach((postDoc) => {
          myPosts.push({
            id: postDoc.id,
            data: postDoc.data()
          });
        });

      } catch(error){
        const myPostsQuery = query(
          collection(db, "posts"),
          where("userId", "==", currentUser.uid)
        );

        const myPostsSnapshot = await getDocs(myPostsQuery);

        myPosts = [];

        myPostsSnapshot.forEach((postDoc) => {
          myPosts.push({
            id: postDoc.id,
            data: postDoc.data()
          });
        });

        myPosts.sort((a, b) => getPostDate(b.data.createdAt) - getPostDate(a.data.createdAt));
      }

      receivedLikePosts = [...myPosts].sort((a, b) => {
        const likeDiff = (b.data.likes || 0) - (a.data.likes || 0);

        if(likeDiff !== 0){
          return likeDiff;
        }

        return getPostDate(b.data.createdAt) - getPostDate(a.data.createdAt);
      });

      try{
        const likedQuery = query(
          collection(db, "posts"),
          where("likedBy", "array-contains", currentUser.uid)
        );

        const likedSnapshot = await getDocs(likedQuery);

        likedPosts = [];

        likedSnapshot.forEach((postDoc) => {
          likedPosts.push({
            id: postDoc.id,
            data: postDoc.data()
          });
        });

        likedPosts.sort((a, b) => getPostDate(b.data.createdAt) - getPostDate(a.data.createdAt));

      } catch(error){
        likedPosts = [];
      }
    }

    function loadStats(){
      let totalLikes = 0;

      myPosts.forEach((item) => {
        totalLikes += item.data.likes || 0;
      });

      postCount.innerText = myPosts.length;
      likeCount.innerText = totalLikes;
      likedCount.innerText = likedPosts.length;
    }

    function getCurrentActivityList(){
      if(currentTab === "receivedLikes"){
        return receivedLikePosts;
      }

      if(currentTab === "likedPosts"){
        return likedPosts;
      }

      return myPosts;
    }

    function getEmptyMessage(){
      if(currentTab === "receivedLikes"){
        return "아직 공감을 받은 글이 없어요.<br>공감받을 이야기를 남겨보세요.";
      }

      if(currentTab === "likedPosts"){
        return "아직 공감한 글이 없어요.<br>마음 가는 글에 하트를 눌러보세요.";
      }

      return "아직 작성한 글이 없어요.<br>첫 이야기를 남겨보세요.";
    }

    function renderActivityList(){
      const list = getCurrentActivityList();

      activityList.innerHTML = "";

      if(list.length === 0){
        activityList.innerHTML = `
          <div class="empty">
            ${getEmptyMessage()}
          </div>
        `;
        return;
      }

      const visibleList = list.slice(0, activityVisibleCount);

      visibleList.forEach((item) => {
        const post = item.data;

        activityList.innerHTML += `
          <div class="mini-post" onclick="goDetail('${item.id}')">
            <div class="mini-thumb">
              ${getThumbHtml(post)}
            </div>

            <div class="mini-info">
              <div class="mini-category">${escapeHTML(post.category || "육아")}</div>
              <div class="mini-title">${escapeHTML(post.title || "제목 없음")}</div>

              <div class="mini-meta">
                <span>♥ ${post.likes || 0}</span>
                <span>댓글 ${post.commentCount || 0}</span>
                <span>조회 ${post.views || 0}</span>
                <span>${getTimeText(post.createdAt)}</span>
              </div>
            </div>
          </div>
        `;
      });

      if(list.length > activityVisibleCount){
        activityList.innerHTML += `
          <button class="more-btn" type="button" onclick="loadMoreActivities()">
            더보기 ${activityVisibleCount}/${list.length}
          </button>
        `;
      }
    }

    function setActiveTab(tabName){
      currentTab = tabName;
      activityVisibleCount = 8;

      myPostsTab.classList.toggle("active", tabName === "myPosts");
      receivedLikesTab.classList.toggle("active", tabName === "receivedLikes");
      likedPostsTab.classList.toggle("active", tabName === "likedPosts");

      renderActivityList();
    }

    window.loadMoreActivities = function(){
      activityVisibleCount += 8;
      renderActivityList();
    };

    myPostsTab.addEventListener("click", () => {
      setActiveTab("myPosts");
    });

    receivedLikesTab.addEventListener("click", () => {
      setActiveTab("receivedLikes");
    });

    likedPostsTab.addEventListener("click", () => {
      setActiveTab("likedPosts");
    });

    saveVisibilityBtn.addEventListener("click", async () => {
      const checked = document.querySelector("input[name='profileVisibility']:checked");

      if(!checked){
        alert("공개 여부를 선택해주세요.");
        return;
      }

      try{
        profileVisibility = checked.value;

        await setDoc(doc(db, "users", currentUser.uid), {
          profileVisibility: profileVisibility,
          updatedAt: new Date()
        }, { merge:true });

        renderVisibility();

        alert(profileVisibility === "public" ? "프로필이 공개로 설정됐어요." : "프로필이 비공개로 설정됐어요.");

      } catch(error){
        alert("공개 설정 저장 실패: " + error.message);
      }
    });

    function compressProfileImage(file){
      return new Promise((resolve, reject) => {
        if(!file || !file.type.startsWith("image/")){
          reject(new Error("이미지 파일만 업로드할 수 있어요."));
          return;
        }

        const reader = new FileReader();

        reader.onload = (event) => {
          const img = new Image();

          img.onload = () => {
            const maxSize = 700;
            let width = img.width;
            let height = img.height;

            if(width > height && width > maxSize){
              height = Math.round((height * maxSize) / width);
              width = maxSize;
            } else if(height >= width && height > maxSize){
              width = Math.round((width * maxSize) / height);
              height = maxSize;
            }

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob((blob) => {
              if(!blob){
                reject(new Error("이미지 압축에 실패했어요."));
                return;
              }

              const originalName = file.name.replace(/\.[^/.]+$/, "");
              const compressedFile = new File(
                [blob],
                originalName + "_profile.jpg",
                {
                  type: "image/jpeg",
                  lastModified: Date.now()
                }
              );

              resolve(compressedFile);
            }, "image/jpeg", 0.78);
          };

          img.onerror = () => {
            reject(new Error("이미지를 불러오지 못했어요."));
          };

          img.src = event.target.result;
        };

        reader.onerror = () => {
          reject(new Error("이미지를 읽지 못했어요."));
        };

        reader.readAsDataURL(file);
      });
    }

    photoInput.addEventListener("change", async () => {
      const file = photoInput.files[0];

      if(!file){
        return;
      }

      try{
        profilePhoto.innerText = "…";

        const compressedFile = await compressProfileImage(file);
        const safeFileName = compressedFile.name.replaceAll(" ", "_");

        const imageRef = ref(
          storage,
          "profileImages/" + currentUser.uid + "/" + Date.now() + "_" + safeFileName
        );

        await uploadBytes(imageRef, compressedFile, {
          contentType: compressedFile.type
        });

        const downloadURL = await getDownloadURL(imageRef);

        await setDoc(doc(db, "users", currentUser.uid), {
          photoURL: downloadURL,
          photoUrl: downloadURL,
          updatedAt: new Date()
        }, { merge:true });

        currentPhotoURL = downloadURL;
        renderPhoto();

        alert("프로필 사진이 변경됐어요.");

      } catch(error){
        alert("사진 업로드 실패: " + error.message);
        renderPhoto();
      }
    });

    saveStatusBtn.addEventListener("click", async () => {
      const nextStatus = statusInput.value.trim();
      const checkedStage = document.querySelector("input[name='editStage']:checked");
      const nextStage = checkedStage ? checkedStage.value : currentStage;

      try{
        await setDoc(doc(db, "users", currentUser.uid), {
          status: nextStatus,
          stage: nextStage,
          updatedAt: new Date()
        }, { merge:true });

        currentStage = nextStage;
        stageBadge.innerText = "🌷 " + currentStage + " 부모";
        renderStageEdit();

        statusText.innerText = nextStatus || "상태메시지가 아직 없어요.";
        statusInput.value = nextStatus;

        alert("프로필 정보가 저장됐어요.");

      } catch(error){
        alert("저장 실패: " + error.message);
      }
    });

    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
      alert("로그아웃 되었습니다.");
      window.location.href = "index.html";
    });

    window.goDetail = function(postId){
      window.location.href = "detail.html?id=" + encodeURIComponent(postId);
    };
  </script>

</body>
</html>
