<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>게시글 보기 - 오늘도육아</title>

  <link rel="stylesheet" href="theme.css">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{width:100%;min-height:100%;}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;
      background:#fff7fb;color:#241f21;padding-bottom:112px;overflow-x:hidden;
    }
    button,input{font-family:inherit;} button{cursor:pointer;}

    .header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid #f4dce6;box-shadow:0 4px 18px rgba(255,92,138,.055);}
    .header-inner{width:100%;max-width:430px;margin:0 auto;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
    .brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:900;color:#ff5c8a;letter-spacing:-.7px;white-space:nowrap;cursor:pointer;min-width:0;}
    .mini-logo{width:19px;height:19px;border-radius:50%;background:#ff5c8a;position:relative;display:inline-block;flex-shrink:0;}
    .mini-logo::after{content:'';position:absolute;width:19px;height:19px;border-radius:50%;background:#ffe4ef;top:-2px;left:7px;}
    .header-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-shrink:0;}
    .pill,.back-link,.notice-link{background:#fff;color:#ff5c8a;border:1px solid #ffd6e7;box-shadow:0 8px 22px rgba(255,92,138,.08);text-decoration:none;font-weight:900;white-space:nowrap;}
    .pill,.back-link{height:38px;padding:0 11px;border-radius:999px;font-size:12px;display:flex;align-items:center;justify-content:center;}
    .dark-mode-toggle{min-width:38px;padding:0 10px;}
    .notice-link{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;position:relative;}
    .notice-badge,.notification-badge{position:absolute;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#ff2f6d;color:#fff;font-size:10px;font-weight:900;line-height:18px;text-align:center;border:2px solid #fff;box-shadow:0 4px 10px rgba(255,47,109,.32);display:none;}
    .notice-badge{right:-5px;top:-5px;}.notice-badge.active{display:block;}.notification-badge{right:-7px;top:-6px;}

    .container{width:100%;max-width:430px;margin:0 auto;padding:14px 13px 24px;}
    .post,.comment-section,.empty{background:#fff;border:1px solid #f3dfe7;border-radius:24px;box-shadow:0 10px 24px rgba(255,92,138,.075);overflow:hidden;}
    .empty{padding:28px 16px;text-align:center;color:#8d7c83;font-size:14px;font-weight:800;line-height:1.6;}

    .image-grid{display:grid;gap:2px;background:#fff;position:relative;}
    .image-grid.one{grid-template-columns:1fr;}.image-grid.two{grid-template-columns:1fr 1fr;}.image-grid.three{grid-template-columns:1fr 1fr;grid-template-rows:128px 128px;}
    .image-grid.three .post-image:first-child{grid-row:1/3;height:258px;}
    .post-image{width:100%;height:235px;object-fit:cover;display:block;background:#fff7fa;cursor:pointer;}
    .image-grid.two .post-image,.image-grid.three .post-image{height:128px;}
    .image-more{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.62);color:#fff;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900;}

    .post-body{padding:16px 15px 14px;}
    .post-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px;}
    .user-area{display:flex;align-items:center;gap:9px;min-width:0;cursor:pointer;}
    .profile{width:38px;height:38px;border-radius:14px;background:#fff0f5;color:#ff5c8a;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;overflow:hidden;flex-shrink:0;}
    .profile img{width:100%;height:100%;object-fit:cover;display:block;}
    .name{font-size:13.5px;font-weight:900;color:#2e2529;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .time{margin-top:2px;color:#a7959c;font-size:11.5px;font-weight:700;}
    .top-buttons{display:flex;align-items:center;gap:6px;flex-shrink:0;}
    .delete-btn,.report-btn{border:1px solid #ffd6e7;background:#fff0f5;color:#ff5c8a;border-radius:999px;padding:7px 10px;font-size:11.5px;font-weight:900;}
    .report-btn{background:#fff7fa;color:#8b6f78;border-color:#f3dfe7;}
    .post-category{display:inline-flex;align-items:center;padding:7px 10px;border-radius:999px;background:#fff5f9;border:1px solid #f3dfe7;color:#ff5c8a;font-size:11.5px;font-weight:900;margin-bottom:11px;cursor:pointer;}
    .title{font-size:21px;line-height:1.42;font-weight:900;letter-spacing:-.7px;color:#241f21;word-break:keep-all;overflow-wrap:anywhere;margin-bottom:10px;}
    .content{font-size:14.5px;line-height:1.78;color:#5f5357;white-space:pre-line;word-break:break-word;background:#fffbfc;border:1px solid #f7e6ed;border-radius:18px;padding:14px;}
    .post-footer{padding:11px 15px 14px;border-top:1px solid #f7e6ed;background:#fffbfc;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
    .actions{display:flex;gap:7px;flex-wrap:wrap;}
    .action-btn{border:1px solid #f2dde6;background:#fff;color:#7b6d72;border-radius:999px;padding:8px 10px;font-size:12px;font-weight:900;display:flex;align-items:center;gap:5px;}
    .action-btn:active,.delete-btn:active,.report-btn:active,.comment-btn:active{transform:scale(.97);}
    .like-btn,.heart-red{color:#ff3d73;}.like-btn.liked{background:#fff0f5;border-color:#ffd6e7;color:#ff3d73;}
    .post-views{color:#ad9da3;font-size:11.5px;font-weight:900;white-space:nowrap;}

    .comment-section{margin-top:14px;padding:15px;}
    .comment-section h3{font-size:18px;font-weight:900;letter-spacing:-.5px;color:#241f21;margin-bottom:10px;}
    .comment-input{width:100%;height:45px;border:1px solid #f3dfe7;border-radius:18px;background:#fff7fa;padding:0 13px;outline:none;color:#2f272a;font-size:13.5px;margin-bottom:8px;}
    .comment-input:focus{background:#fff;border-color:#ff8fb1;box-shadow:0 0 0 4px rgba(255,92,138,.08);}
    .comment-btn{width:100%;height:43px;border:none;border-radius:17px;background:#ff5c8a;color:#fff;font-size:13px;font-weight:900;box-shadow:0 10px 22px rgba(255,92,138,.18);margin-bottom:14px;}
    .comment-btn:disabled{opacity:.65;cursor:not-allowed;}
    .comment{background:#fff7fa;border:1px solid #f3dfe7;border-radius:18px;padding:12px;margin-bottom:9px;}
    .comment-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;}
    .comment-name{color:#ff5c8a;font-size:12px;font-weight:900;}
    .comment-top-buttons{display:flex;gap:6px;flex-shrink:0;}
    .comment-delete,.comment-report{border:none;background:#fff0f5;color:#ff5c8a;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900;}
    .comment-report{background:#fff;color:#8b6f78;border:1px solid #f3dfe7;}
    .comment-text{white-space:pre-line;word-break:break-word;color:#4d4447;font-size:13.5px;line-height:1.58;}
    .comment-time{color:#aa9ba1;font-size:11px;margin-top:6px;font-weight:700;}
    .comment-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
    .comment-action-btn{border:1px solid #f3dfe7;background:#fff;color:#7d7276;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:900;}
    .comment-action-btn.good{color:#ff3d73;}.comment-action-btn.bad{color:#777;}.comment-action-btn.active{background:#fff0f5;border-color:#ffd6e7;}
    .comment-pages{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:13px;}
    .comment-page-btn{min-width:30px;height:30px;border-radius:999px;border:1px solid #f3dfe7;background:#fff;color:#8d7c83;font-size:12px;font-weight:900;}
    .comment-page-btn.active{background:#ff5c8a;color:#fff;border-color:#ff5c8a;}

    .bottom-menu{position:fixed;left:0;bottom:14px;width:100%;z-index:999;padding:0 14px env(safe-area-inset-bottom);background:transparent;border:none;pointer-events:none;}
    .bottom-inner{width:100%;max-width:430px;height:78px;margin:0 auto;display:flex;justify-content:space-around;align-items:center;background:rgba(255,255,255,.97);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,214,231,.9);border-radius:30px;box-shadow:0 14px 34px rgba(255,92,138,.15);pointer-events:auto;}
    .bottom-menu a,.menu-item{width:25%;height:100%;text-decoration:none;color:#7d6c72;font-size:12px;text-align:center;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;position:relative;}
    .menu-icon{width:45px;height:45px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#7d6c72;position:relative;}
    .menu-icon svg{width:26px;height:26px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;display:block;}
    .bottom-menu a.active,.menu-item.active{color:#ff5c8a;}.bottom-menu a.active .menu-icon,.menu-item.active .menu-icon{color:#ff5c8a;background:linear-gradient(135deg,#fff0f5,#ffe3ee);box-shadow:0 10px 24px rgba(255,92,138,.14);}
    .menu-icon.home-icon::after{content:'❤';position:absolute;top:-6px;right:1px;width:17px;height:17px;border-radius:50%;background:#ff8fb1;color:#fff;font-size:10px;line-height:17px;text-align:center;box-shadow:0 5px 12px rgba(255,92,138,.22);}
    .menu-item span{line-height:1;letter-spacing:-.35px;}

    .image-modal{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;z-index:2000;padding:20px;}
    .image-modal.active{display:flex;}.image-modal img{max-width:100%;max-height:86vh;border-radius:18px;object-fit:contain;}.modal-close{position:absolute;right:18px;top:18px;width:42px;height:42px;border:none;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:28px;line-height:42px;}

    body.dark-mode{background:#181216;color:#f7edf2;}
    body.dark-mode .header{background:rgba(28,20,25,.94);border-color:#3a2730;box-shadow:none;}
    body.dark-mode .brand,body.dark-mode .pill,body.dark-mode .back-link,body.dark-mode .notice-link{color:#ff8fb1;}body.dark-mode .mini-logo{background:#ff8fb1;}body.dark-mode .mini-logo::after{background:#2a1d24;}
    body.dark-mode .pill,body.dark-mode .back-link,body.dark-mode .notice-link,body.dark-mode .post,body.dark-mode .comment-section,body.dark-mode .empty,body.dark-mode .bottom-inner{background:#261b22;border-color:#4a303b;box-shadow:0 12px 26px rgba(0,0,0,.24);}
    body.dark-mode .image-grid,body.dark-mode .story-card .post-image-wrap{background:#261b22;}body.dark-mode .profile,body.dark-mode .post-category,body.dark-mode .like-btn.liked,body.dark-mode .comment-action-btn.active{background:#3a2430;color:#ff8fb1;border-color:#5b3747;}
    body.dark-mode .name,body.dark-mode .title,body.dark-mode .comment-section h3{color:#fff6fa;}body.dark-mode .time,body.dark-mode .post-views,body.dark-mode .comment-time{color:#c9aeb9;}
    body.dark-mode .content,body.dark-mode .post-footer,body.dark-mode .comment,body.dark-mode .comment-input{background:#2b1e25;border-color:#4a303b;color:#e9d7df;}
    body.dark-mode .action-btn,body.dark-mode .comment-action-btn,body.dark-mode .comment-report{background:#34242d;border-color:#4a303b;color:#f5e8ee;}body.dark-mode .comment-text{color:#f5e8ee;}body.dark-mode .delete-btn,body.dark-mode .comment-delete{background:#3a2430;color:#ff8fb1;border-color:#5b3747;}
    body.dark-mode .bottom-menu a,body.dark-mode .menu-item,body.dark-mode .menu-icon{color:#c9aeb9;}body.dark-mode .bottom-menu a.active,body.dark-mode .menu-item.active,body.dark-mode .bottom-menu a.active .menu-icon{color:#ff8fb1;}body.dark-mode .bottom-menu a.active .menu-icon{background:linear-gradient(135deg,#3a2430,#553144);}
    body.dark-mode .notification-badge,body.dark-mode .notice-badge{border-color:#22181e;}

    @media(max-width:390px){.container{padding-left:11px;padding-right:11px;}.header-inner{padding-left:14px;padding-right:14px;}.brand{font-size:20px;}.back-link{padding:0 10px;font-size:11.5px;}.post-image{height:215px;}.image-grid.three{grid-template-rows:118px 118px;}.image-grid.three .post-image:first-child{height:238px;}.image-grid.two .post-image,.image-grid.three .post-image{height:118px;}.post-body{padding:15px 13px 13px;}.title{font-size:20px;}.post-footer{padding:10px 13px 13px;}.action-btn{padding:8px 9px;font-size:11.5px;}.comment-section{padding:13px;}}

  </style>
</head>

<body>

  <div class="header">
    <div class="header-inner">
      <div class="brand" onclick="location.href='home.html'">
        <span class="mini-logo"></span>
        오늘도육아
      </div>

      <div class="header-actions">
        <button
          class="pill dark-mode-toggle"
          data-mode="icon"
          onclick="toggleDarkMode()"
          type="button"
          aria-label="야간모드 전환"
        >
          🌙
        </button>

        <a href="notifications.html" class="notice-link" aria-label="알림">
          🔔
          <span class="notice-badge" id="noticeBadge">0</span>
        </a>

        <a href="home.html" class="back-link">홈으로</a>
      </div>
    </div>
  </div>

  <div class="container">
    <div id="postArea"></div>

    <div class="comment-section" id="commentSection" style="display:none;">
      <h3 id="commentTitle">댓글</h3>

      <input
        type="text"
        id="commentInput"
        class="comment-input"
        placeholder="따뜻한 댓글을 남겨주세요"
      >

      <button id="commentBtn" class="comment-btn">
        댓글 등록
      </button>

      <div id="commentList"></div>
      <div class="comment-pages" id="commentPages"></div>
    </div>
  </div>

  <div class="image-modal" id="imageModal">
    <button class="modal-close" id="modalClose">×</button>
    <img id="modalImage" src="" alt="확대 이미지">
  </div>

  <div class="bottom-menu">
    <div class="bottom-inner">
      <a href="home.html" class="menu-item" aria-label="홈">
        <div class="menu-icon home-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.5 11.2 12 4l8.5 7.2"></path>
            <path d="M5.7 10.4v8.3c0 .8.6 1.4 1.4 1.4h3.1v-5.4h3.6v5.4h3.1c.8 0 1.4-.6 1.4-1.4v-8.3"></path>
          </svg>
        </div>
        <span>홈</span>
      </a>

      <a href="write.html" class="menu-item" aria-label="글쓰기">
        <div class="menu-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 20h4.6L19.2 9.4a2.4 2.4 0 0 0 0-3.4L18 4.8a2.4 2.4 0 0 0-3.4 0L4 15.4V20z"></path>
            <path d="M13.7 5.7l4.6 4.6"></path>
            <path d="M4 15.4 8.6 20"></path>
          </svg>
        </div>
        <span>글쓰기</span>
      </a>

      <a href="notifications.html" class="menu-item notification-link" aria-label="알림">
        <div class="menu-icon notification-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18.2 9.8a6.2 6.2 0 0 0-12.4 0c0 7-2.4 7.7-2.4 7.7h17.2s-2.4-.7-2.4-7.7z"></path>
            <path d="M9.8 20.1a2.6 2.6 0 0 0 4.4 0"></path>
          </svg>
          <span id="notificationBadge" class="notification-badge"></span>
        </div>
        <span>알림</span>
      </a>

      <a href="profile.html" class="menu-item" aria-label="내정보">
        <div class="menu-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 12.3a4.2 4.2 0 1 0 0-8.4 4.2 4.2 0 0 0 0 8.4z"></path>
            <path d="M4.4 20.2c1.2-3.5 4-5.3 7.6-5.3s6.4 1.8 7.6 5.3"></path>
          </svg>
        </div>
        <span>내정보</span>
      </a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      updateDoc,
      deleteDoc,
      collection,
      addDoc,
      getDocs,
      query,
      where,
      orderBy,
      limit,
      startAfter,
      increment,
      arrayUnion,
      arrayRemove,
      getCountFromServer,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD4x9d4aQlbroxcnT2v-zHODDPdQabIFx0",
      authDomain: "today-parenting-app.firebaseapp.com",
      projectId: "today-parenting-app",
      storageBucket: "today-parenting-app.firebasestorage.app",
      messagingSenderId: "375329953167",
      appId: "1:375329953167:web:d29af0e45cc7d10e9f67fa"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const postArea = document.getElementById("postArea");
    const commentSection = document.getElementById("commentSection");
    const commentTitle = document.getElementById("commentTitle");
    const commentInput = document.getElementById("commentInput");
    const commentBtn = document.getElementById("commentBtn");
    const commentList = document.getElementById("commentList");
    const commentPages = document.getElementById("commentPages");

    const imageModal = document.getElementById("imageModal");
    const modalImage = document.getElementById("modalImage");
    const modalClose = document.getElementById("modalClose");

    const params = new URLSearchParams(window.location.search);
    const postId = params.get("id");

    let currentUser = null;
    let currentNickname = "사용자";
    let notificationBadgeUnsubscribe = null;
    let currentPost = null;
    let comments = [];
    let commentPage = 1;
    let totalCommentCount = 0;
    let totalCommentPages = 1;
    let commentPageCache = {};
    let commentPageLastDocs = {};
    const commentsPerPage = 10;

    if(!postId){
      postArea.innerHTML = `
        <div class="empty">
          게시글 정보를 찾을 수 없어요.<br>
          다시 목록에서 게시글을 선택해주세요.
        </div>
      `;
    }

    function escapeHTML(text){
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getPostDate(createdAt){
      if(!createdAt){
        return new Date(0);
      }

      if(createdAt.toDate){
        return createdAt.toDate();
      }

      return new Date(createdAt);
    }

    function getTimeText(createdAt){
      const postDate = getPostDate(createdAt);

      if(postDate.getTime() === 0){
        return "방금 전";
      }

      const now = new Date();
      const diff = now - postDate;
      const minute = 60 * 1000;
      const hour = 60 * minute;
      const day = 24 * hour;

      if(diff < minute){
        return "방금 전";
      }

      if(diff < hour){
        return Math.floor(diff / minute) + "분 전";
      }

      if(diff < day){
        return Math.floor(diff / hour) + "시간 전";
      }

      if(diff < day * 7){
        return Math.floor(diff / day) + "일 전";
      }

      return postDate.getFullYear() + "." +
        String(postDate.getMonth() + 1).padStart(2, "0") + "." +
        String(postDate.getDate()).padStart(2, "0");
    }

    function getPostImages(post){
      if(Array.isArray(post.imageUrls) && post.imageUrls.length > 0){
        return post.imageUrls.filter((url) => url);
      }

      if(post.imageUrl){
        return [post.imageUrl];
      }

      return [];
    }

    function getProfileHtml(userData, nickname){
      const photoURL = userData && (userData.photoURL || userData.photoUrl);

      if(photoURL){
        return `<img src="${escapeHTML(photoURL)}" alt="프로필 사진">`;
      }

      return escapeHTML(nickname ? nickname.charAt(0) : "U");
    }

    function makeImageHtml(post){
      const images = getPostImages(post);

      if(images.length === 0){
        return "";
      }

      const limitedImages = images.slice(0, 3);
      let gridClass = "one";

      if(limitedImages.length === 2){
        gridClass = "two";
      }

      if(limitedImages.length >= 3){
        gridClass = "three";
      }

      const imageItems = limitedImages.map((url) => {
        const safeUrl = escapeHTML(url);

        return `
          <img
            src="${safeUrl}"
            class="post-image"
            alt="게시글 이미지"
            onclick="openImage('${safeUrl}')"
            loading="lazy"
            decoding="async"
          >
        `;
      }).join("");

      const moreCount = images.length - limitedImages.length;
      const moreHtml = moreCount > 0
        ? `<div class="image-more" onclick="openImage('${escapeHTML(images[3] || images[0])}')">+${moreCount}</div>`
        : "";

      return `
        <div class="image-grid ${gridClass}">
          ${imageItems}
          ${moreHtml}
        </div>
      `;
    }

    function normalizeNotificationType(type){
      if(type === "comment"){
        return "post_comment";
      }

      return type;
    }

    function startNotificationBadge(uid){
      const badges = [
        document.getElementById("noticeBadge"),
        document.getElementById("notificationBadge")
      ].filter(Boolean);

      if(badges.length === 0 || !uid){
        return;
      }

      if(notificationBadgeUnsubscribe){
        notificationBadgeUnsubscribe();
      }

      const unreadQuery = query(
        collection(db, "notifications"),
        where("receiverId", "==", uid),
        where("isRead", "==", false)
      );

      notificationBadgeUnsubscribe = onSnapshot(unreadQuery, (snapshot) => {
        const count = snapshot.size;
        const countText = count > 99 ? "99+" : String(count);

        badges.forEach((badge) => {
          if(count > 0){
            badge.innerText = countText;

            if(badge.classList.contains("notice-badge")){
              badge.classList.add("active");
            } else {
              badge.style.display = "flex";
            }
          } else {
            badge.innerText = "";

            if(badge.classList.contains("notice-badge")){
              badge.classList.remove("active");
            } else {
              badge.style.display = "none";
            }
          }
        });
      }, (error) => {
        console.log("알림 뱃지 오류:", error.message);

        badges.forEach((badge) => {
          badge.innerText = "";

          if(badge.classList.contains("notice-badge")){
            badge.classList.remove("active");
          } else {
            badge.style.display = "none";
          }
        });
      });
    }

    async function refreshCommentCount(){
      const countSnapshot = await getCountFromServer(
        collection(db, "posts", postId, "comments")
      );

      totalCommentCount = countSnapshot.data().count || 0;
      totalCommentPages = Math.max(1, Math.ceil(totalCommentCount / commentsPerPage));

    async function fetchCommentPage(page){
      if(commentPageCache[page]){
        return commentPageCache[page];
      }

      let commentsQuery;

      if(page <= 1){
        commentsQuery = query(
          collection(db, "posts", postId, "comments"),
          orderBy("createdAt", "asc"),
          limit(commentsPerPage)
        );
      } else {
        if(!commentPageLastDocs[page - 1]){
          await fetchCommentPage(page - 1);
        }

        const previousLastDoc = commentPageLastDocs[page - 1];

        if(!previousLastDoc){
          commentPageCache[page] = [];
          return commentPageCache[page];
        }

        commentsQuery = query(
          collection(db, "posts", postId, "comments"),
          orderBy("createdAt", "asc"),
          startAfter(previousLastDoc),
          limit(commentsPerPage)
        );
      }

      const commentsSnapshot = await getDocs(commentsQuery);
      const pageComments = [];

      commentsSnapshot.forEach((commentDoc) => {
        pageComments.push({
          id: commentDoc.id,
          data: commentDoc.data()
        });
      });

      commentPageCache[page] = pageComments;
      commentPageLastDocs[page] = commentsSnapshot.docs[commentsSnapshot.docs.length - 1] || null;

      return pageComments;
    }

    };

    window.deleteComment = async function(commentId){
      const confirmDelete = confirm("댓글을 삭제할까요?");

      if(!confirmDelete){
        return;
      }

      try{
        await deleteDoc(doc(db, "posts", postId, "comments", commentId));
        await updateDoc(doc(db, "posts", postId), {
          commentCount: increment(-1)
        });

        resetCommentCache();
        await refreshCommentCount();

        if(commentPage > totalCommentPages){
          commentPage = totalCommentPages;
        }

        await loadComments(commentPage);

      } catch(error){
        alert(error.message);
      }
    };

    window.openImage = function(imageUrl){
      modalImage.src = imageUrl;
      imageModal.classList.add("active");
    };

    window.goUser = function(uid){
      if(!uid){
        return;
      }

      if(currentUser && uid === currentUser.uid){
        window.location.href = "profile.html";
      } else {
        window.location.href = "user.html?uid=" + encodeURIComponent(uid);
      }
    };

    window.goCategory = function(category){
      if(!category){
        window.location.href = "home.html";
        return;
      }

      window.location.href = "home.html?category=" + encodeURIComponent(category);
    };

    modalClose.addEventListener("click", () => {
      imageModal.classList.remove("active");
      modalImage.src = "";
    });

    imageModal.addEventListener("click", (event) => {
      if(event.target === imageModal){
        imageModal.classList.remove("active");
        modalImage.src = "";
      }
    });
  </script>

<script src="theme.js"></script>

</body>
</html>
