<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>관리자 페이지 - 오늘도육아</title>

  <script src="theme.js"></script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

    body{
      font-family:Arial,sans-serif;
      background:linear-gradient(135deg,#fff7fb,#ffeaf2);
      color:#2f272a;
      min-height:100vh;
      overflow-x:hidden;
      position:relative;
    }

    body::before{
      content:'';
      position:fixed;
      width:320px;
      height:320px;
      background:#ffd6e7;
      border-radius:50%;
      top:-130px;
      left:-130px;
      opacity:0.5;
      z-index:-1;
    }

    body::after{
      content:'';
      position:fixed;
      width:260px;
      height:260px;
      background:#ffc8dc;
      border-radius:50%;
      bottom:-100px;
      right:-100px;
      opacity:0.32;
      z-index:-1;
    }

    .header{
      position:sticky;
      top:0;
      z-index:100;
      background:rgba(255,255,255,0.9);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      border-bottom:1px solid rgba(255,214,231,0.55);
    }

    .header-inner{
      width:100%;
      max-width:940px;
      margin:0 auto;
      padding:15px 16px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      color:#ff5c8a;
      font-size:22px;
      font-weight:900;
      letter-spacing:-0.8px;
      cursor:pointer;
      white-space:nowrap;
    }

    .mini-logo{
      width:19px;
      height:19px;
      border-radius:50%;
      background:#ff5c8a;
      position:relative;
      display:inline-block;
      flex-shrink:0;
    }

    .mini-logo::after{
      content:'';
      position:absolute;
      width:19px;
      height:19px;
      border-radius:50%;
      background:#ffe4ef;
      top:-2px;
      left:7px;
    }

    .header-actions{
      display:flex;
      align-items:center;
      gap:8px;
      flex-shrink:0;
    }

    .pill-btn{
      border:none;
      text-decoration:none;
      color:#ff5c8a;
      background:white;
      border:1px solid #ffd6e7;
      padding:9px 12px;
      border-radius:999px;
      font-size:12px;
      font-weight:900;
      box-shadow:0 8px 22px rgba(255,92,138,0.08);
      cursor:pointer;
      white-space:nowrap;
    }

    .container{
      width:100%;
      max-width:940px;
      margin:0 auto;
      padding:18px 14px 34px;
    }

    .panel{
      background:rgba(255,255,255,0.97);
      border-radius:28px;
      padding:18px;
      box-shadow:0 14px 35px rgba(255,92,138,0.08);
      border:1px solid rgba(255,255,255,0.95);
      margin-bottom:14px;
    }

    .admin-title{
      font-size:22px;
      font-weight:900;
      color:#261f22;
      letter-spacing:-0.7px;
      margin-bottom:8px;
    }

    .admin-desc{
      color:#7d7276;
      font-size:13.5px;
      line-height:1.65;
    }

    .summary-grid{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:10px;
      margin-top:16px;
    }

    .summary-card{
      background:#fff8fb;
      border:1px solid #f5e4eb;
      border-radius:20px;
      padding:13px 10px;
      text-align:center;
    }

    .summary-number{
      font-size:22px;
      font-weight:900;
      color:#ff3d73;
      margin-bottom:4px;
    }

    .summary-label{
      font-size:11.5px;
      font-weight:900;
      color:#8b7f83;
    }

    .tabs{
      display:flex;
      gap:7px;
      overflow-x:auto;
      padding-bottom:2px;
      margin-top:14px;
    }

    .tab-btn{
      border:none;
      background:white;
      color:#8b7f83;
      border:1px solid #f3dfe7;
      padding:9px 12px;
      border-radius:999px;
      font-size:12px;
      font-weight:900;
      cursor:pointer;
      white-space:nowrap;
    }

    .tab-btn.active{
      background:#ff5c8a;
      color:white;
      border-color:#ff5c8a;
      box-shadow:0 10px 22px rgba(255,92,138,0.18);
    }

    .search-row{
      display:flex;
      gap:8px;
      margin-top:14px;
    }

    .search-input{
      flex:1;
      min-width:0;
      border:1px solid #f3dfe7;
      background:#fff7fa;
      border-radius:17px;
      padding:12px 13px;
      outline:none;
      color:#2f272a;
      font-size:13.5px;
    }

    .search-input:focus{
      background:white;
      border-color:#ff8fb1;
      box-shadow:0 0 0 4px rgba(255,92,138,0.08);
    }

    .refresh-btn{
      border:none;
      background:#ff5c8a;
      color:white;
      padding:0 14px;
      border-radius:17px;
      font-size:13px;
      font-weight:900;
      cursor:pointer;
      box-shadow:0 12px 26px rgba(255,92,138,0.2);
      white-space:nowrap;
    }

    .bulk-panel{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      margin-top:14px;
      background:#fff8fb;
      border:1px solid #f5e4eb;
      border-radius:20px;
      padding:12px;
    }

    .bulk-left,
    .bulk-right{
      display:flex;
      gap:7px;
      align-items:center;
      flex-wrap:wrap;
    }

    .bulk-btn{
      border:none;
      border-radius:999px;
      padding:9px 11px;
      font-size:12px;
      font-weight:900;
      cursor:pointer;
      background:white;
      color:#7d7276;
      border:1px solid #f3dfe7;
    }

    .bulk-btn.dark{background:#342b2f;color:white;border-color:#342b2f;}
    .bulk-btn.pink{background:#fff0f5;color:#ff5c8a;border-color:#ffd6e7;}
    .bulk-btn.danger{background:#ff3d73;color:white;border-color:#ff3d73;}
    .bulk-btn:disabled{opacity:0.5;cursor:not-allowed;}

    .selected-count{
      color:#ff3d73;
      font-size:12px;
      font-weight:900;
      white-space:nowrap;
    }

    .loading,
    .empty{
      background:rgba(255,255,255,0.95);
      border-radius:28px;
      padding:38px 22px;
      text-align:center;
      color:#8b7f83;
      line-height:1.7;
      font-size:14px;
      box-shadow:0 14px 35px rgba(255,92,138,0.07);
      border:1px solid rgba(255,255,255,0.95);
    }

    .hidden{display:none !important;}

    .report-card{
      background:rgba(255,255,255,0.98);
      border-radius:26px;
      padding:16px;
      margin-bottom:12px;
      box-shadow:0 14px 35px rgba(255,92,138,0.07);
      border:1px solid rgba(255,255,255,0.95);
    }

    .report-card.selected{
      border-color:#ff8fb1;
      box-shadow:0 14px 35px rgba(255,92,138,0.16);
    }

    .report-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
      margin-bottom:12px;
    }

    .report-left{
      min-width:0;
      display:flex;
      gap:10px;
      align-items:flex-start;
    }

    .select-box{
      width:23px;
      height:23px;
      accent-color:#ff5c8a;
      flex-shrink:0;
      margin-top:2px;
      cursor:pointer;
    }

    .report-main{
      min-width:0;
    }

    .report-type-row{
      display:flex;
      align-items:center;
      gap:7px;
      flex-wrap:wrap;
      margin-bottom:8px;
    }

    .type-badge,
    .status-badge,
    .count-badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:6px 9px;
      border-radius:999px;
      font-size:11px;
      font-weight:900;
      white-space:nowrap;
    }

    .type-badge.post{background:#fff0f5;color:#ff3d73;}
    .type-badge.comment{background:#f4f0ff;color:#7d5cff;}
    .status-badge.pending{background:#fff7e9;color:#d38400;}
    .status-badge.done{background:#edf8f0;color:#238544;}
    .status-badge.deleted{background:#f1f1f1;color:#666;}
    .status-badge.auto{background:#ffecef;color:#dd315c;}
    .count-badge{background:#fff8fb;color:#8b7f83;border:1px solid #f3dfe7;}
    .count-badge.hot{background:#ffecef;color:#dd315c;border-color:#ffc6d1;}

    .report-title{
      font-size:17px;
      font-weight:900;
      color:#261f22;
      line-height:1.45;
      letter-spacing:-0.4px;
      word-break:keep-all;
      overflow-wrap:anywhere;
    }

    .report-date{
      color:#aa9ba1;
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
      margin-top:3px;
    }

    .meta-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin:12px 0;
    }

    .meta-item{
      background:#fff8fb;
      border:1px solid #f5e4eb;
      border-radius:16px;
      padding:10px;
      min-width:0;
    }

    .meta-label{
      color:#aa9ba1;
      font-size:11px;
      font-weight:900;
      margin-bottom:5px;
    }

    .meta-value{
      color:#4d4447;
      font-size:12.5px;
      font-weight:800;
      line-height:1.45;
      word-break:break-word;
    }

    .section-title{
      margin-top:12px;
      margin-bottom:7px;
      color:#342b2f;
      font-size:13px;
      font-weight:900;
    }

    .text-box{
      background:#fff9fb;
      border:1px solid #f7e5ec;
      border-radius:18px;
      padding:12px;
      color:#5f5357;
      font-size:13.5px;
      line-height:1.65;
      white-space:pre-line;
      word-break:break-word;
      max-height:180px;
      overflow:auto;
    }

    .btn-wrap{
      display:flex;
      gap:7px;
      flex-wrap:wrap;
      margin-top:14px;
    }

    .action-btn{
      border:none;
      border-radius:999px;
      padding:10px 12px;
      font-size:12px;
      font-weight:900;
      cursor:pointer;
    }

    .view-btn{background:white;color:#ff5c8a;border:1px solid #ffd6e7;}
    .done-btn{background:#342b2f;color:white;}
    .delete-target-btn{background:#ff3d73;color:white;}
    .delete-report-btn{background:#fff0f5;color:#ff5c8a;}

    @media(max-width:820px){
      .summary-grid{grid-template-columns:repeat(3,1fr);}
    }

    @media(max-width:720px){
      .summary-grid{grid-template-columns:repeat(2,1fr);}
      .meta-grid{grid-template-columns:1fr;}
      .header-inner{max-width:430px;}
      .container{max-width:430px;}
      .brand{font-size:21px;}
      .admin-title{font-size:21px;}
      .report-head{display:block;}
      .report-date{margin-top:8px;}
      .report-left{width:100%;}
      .search-row{display:block;}
      .refresh-btn{width:100%;height:44px;margin-top:8px;}
      .bulk-panel{display:block;}
      .bulk-left,.bulk-right{margin-top:8px;}
      .bulk-btn{flex:1;}
    }
  </style>
</head>

<body>

 <div class="header">
  <div class="header-inner">
    <!-- 관리자 로고 -->
    <div class="brand" onclick="location.href='home.html'">
      <span class="mini-logo"></span>
      오늘도육아 관리자
    </div>

    <!-- 오른쪽 버튼 묶음 -->
    <div class="header-actions" style="display:flex; gap:8px; align-items:center; justify-content:flex-end;">
      <!-- 새로고침 버튼 -->
      <button class="pill-btn" onclick="loadReports()">새로고침</button>

      <!-- 홈 버튼 -->
      <a href="home.html" class="pill-btn">홈으로</a>

      <!-- 야간 모드 버튼 -->
      <button class="pill-btn dark-mode-toggle" type="button">🌙 야간</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div id="loadingBox" class="loading">
      관리자 권한을 확인하는 중이에요.
    </div>

    <div id="blockedBox" class="empty hidden">
      관리자만 접근할 수 있는 페이지입니다.<br>
      로그인 계정을 확인해주세요.
      <div style="margin-top:16px;">
        <button class="pill-btn" onclick="location.href='home.html'">홈으로 가기</button>
      </div>
    </div>

    <div id="adminBox" class="hidden">
      <div class="panel">
        <div class="admin-title">신고 관리</div>
        <div class="admin-desc">
          자동삭제 없이 관리자가 직접 확인하고 처리하는 방식이에요.<br>
          누적 3회 이상 신고만 따로 보고, 여러 신고를 선택해서 일괄 처리할 수 있어요.
        </div>

        <div class="summary-grid">
          <div class="summary-card">
            <div class="summary-number" id="totalCount">0</div>
            <div class="summary-label">전체 신고</div>
          </div>
          <div class="summary-card">
            <div class="summary-number" id="pendingCount">0</div>
            <div class="summary-label">대기중</div>
          </div>
          <div class="summary-card">
            <div class="summary-number" id="accumulatedCount">0</div>
            <div class="summary-label">누적 3회 이상</div>
          </div>
          <div class="summary-card">
            <div class="summary-number" id="autoDeletedCount">0</div>
            <div class="summary-label">자동삭제 기록</div>
          </div>
          <div class="summary-card">
            <div class="summary-number" id="doneCount">0</div>
            <div class="summary-label">처리완료</div>
          </div>
        </div>

        <div class="tabs">
          <button class="tab-btn active" data-filter="all" onclick="setFilter('all')">전체</button>
          <button class="tab-btn" data-filter="pending" onclick="setFilter('pending')">대기중</button>
          <button class="tab-btn" data-filter="accumulated" onclick="setFilter('accumulated')">누적 3회 이상</button>
          <button class="tab-btn" data-filter="done" onclick="setFilter('done')">처리완료</button>
          <button class="tab-btn" data-filter="post" onclick="setFilter('post')">게시글</button>
          <button class="tab-btn" data-filter="comment" onclick="setFilter('comment')">댓글</button>
          <button class="tab-btn" data-filter="auto_deleted" onclick="setFilter('auto_deleted')">자동삭제 기록</button>
        </div>

        <div class="search-row">
          <input
            id="searchInput"
            class="search-input"
            type="text"
            placeholder="신고 사유, 제목, 닉네임, 내용 검색"
          >
          <button class="refresh-btn" onclick="loadReports()">갱신</button>
        </div>

        <div class="bulk-panel">
          <div class="bulk-left">
            <button class="bulk-btn" onclick="selectVisibleReports()">현재 목록 전체 선택</button>
            <button class="bulk-btn" onclick="clearSelectedReports()">선택 해제</button>
            <span class="selected-count" id="selectedCountText">선택 0개</span>
          </div>

          <div class="bulk-right">
            <button class="bulk-btn dark" id="bulkDoneBtn" onclick="bulkMarkDone()">선택 처리완료</button>
            <button class="bulk-btn danger" id="bulkTargetBtn" onclick="bulkDeleteTargets()">선택 대상삭제</button>
            <button class="bulk-btn pink" id="bulkReportBtn" onclick="bulkDeleteReports()">선택 신고기록 삭제</button>
          </div>
        </div>
      </div>

      <div id="reportsList"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      doc,
      getDocs,
      getDoc,
      query,
      orderBy,
      updateDoc,
      deleteDoc,
      increment,
      writeBatch
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD4x9d4aQlbroxcnT2v-zHODDPdQabIFx0",
      authDomain: "today-parenting-app.firebaseapp.com",
      projectId: "today-parenting-app",
      storageBucket: "today-parenting-app.firebasestorage.app",
      messagingSenderId: "375329953167",
      appId: "1:375329953167:web:d29af0e45cc7d10e9f67fa"
    };

    // 중요: 실제 관리자 계정 이메일로 바꿔주세요.
    const ADMIN_EMAIL = "admin@todayparenting.local";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loadingBox = document.getElementById("loadingBox");
    const blockedBox = document.getElementById("blockedBox");
    const adminBox = document.getElementById("adminBox");
    const reportsList = document.getElementById("reportsList");
    const searchInput = document.getElementById("searchInput");

    const totalCount = document.getElementById("totalCount");
    const pendingCount = document.getElementById("pendingCount");
    const accumulatedCount = document.getElementById("accumulatedCount");
    const autoDeletedCount = document.getElementById("autoDeletedCount");
    const doneCount = document.getElementById("doneCount");
    const selectedCountText = document.getElementById("selectedCountText");
    const bulkDoneBtn = document.getElementById("bulkDoneBtn");
    const bulkTargetBtn = document.getElementById("bulkTargetBtn");
    const bulkReportBtn = document.getElementById("bulkReportBtn");

    let currentFilter = "all";
    let allReports = [];
    let visibleReports = [];
    let selectedReportIds = new Set();
    let groupCountMap = {};

    onAuthStateChanged(auth, async (user) => {
      loadingBox.classList.add("hidden");

      if(!user || user.email !== ADMIN_EMAIL){
        blockedBox.classList.remove("hidden");
        return;
      }

      adminBox.classList.remove("hidden");
      await loadReports();
    });

    searchInput.addEventListener("input", () => {
      renderReports();
    });

    function escapeHTML(text){
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getDateText(createdAt){
      if(!createdAt){
        return "날짜 없음";
      }

      const date = createdAt.toDate ? createdAt.toDate() : new Date(createdAt);

      if(Number.isNaN(date.getTime())){
        return "날짜 없음";
      }

      return date.getFullYear() + "." +
        String(date.getMonth() + 1).padStart(2, "0") + "." +
        String(date.getDate()).padStart(2, "0") + " " +
        String(date.getHours()).padStart(2, "0") + ":" +
        String(date.getMinutes()).padStart(2, "0");
    }

    function getStatus(report){
      return report.status || "pending";
    }

    function getStatusText(status){
      if(status === "auto_deleted") return "자동삭제";
      if(status === "done") return "처리완료";
      if(status === "target_deleted") return "대상삭제";
      return "대기중";
    }

    function getStatusClass(status){
      if(status === "auto_deleted") return "auto";
      if(status === "done") return "done";
      if(status === "target_deleted") return "deleted";
      return "pending";
    }

    function getMainTitle(report){
      if(report.type === "post"){
        return report.postTitle || "제목 없는 게시글";
      }

      return report.postTitle || "댓글 신고";
    }

    function getTargetText(report){
      if(report.type === "comment"){
        return report.commentText || "댓글 내용 없음";
      }

      return report.postContent || "게시글 내용 없음";
    }

    function getSearchTarget(report){
      return [
        report.type,
        report.status,
        report.reason,
        report.postTitle,
        report.postContent,
        report.commentText,
        report.targetNickname,
        report.reporterNickname,
        report.reporterEmail,
        report.postId,
        report.commentId
      ].join(" ").toLowerCase();
    }

    function getReportKey(report){
      if(report.type === "comment"){
        return "comment_" + (report.postId || "") + "_" + (report.commentId || "");
      }

      return "post_" + (report.postId || "");
    }

    function rebuildGroupCountMap(){
      groupCountMap = {};

      allReports.forEach((report) => {
        const key = getReportKey(report);
        groupCountMap[key] = (groupCountMap[key] || 0) + 1;
      });
    }

    function getReportGroupCount(report){
      return groupCountMap[getReportKey(report)] || 1;
    }

    function isAccumulatedReport(report){
      return getReportGroupCount(report) >= 3;
    }

    function getReportById(reportId){
      return allReports.find((report) => report.id === reportId) || null;
    }

    function getFilteredReports(){
      const keyword = searchInput.value.trim().toLowerCase();
      let filtered = allReports.slice();

      if(currentFilter === "pending"){
        filtered = filtered.filter((report) => getStatus(report) === "pending");
      } else if(currentFilter === "accumulated"){
        filtered = filtered.filter((report) => isAccumulatedReport(report));
      } else if(currentFilter === "auto_deleted"){
        filtered = filtered.filter((report) => getStatus(report) === "auto_deleted");
      } else if(currentFilter === "done"){
        filtered = filtered.filter((report) => getStatus(report) === "done" || getStatus(report) === "target_deleted");
      } else if(currentFilter === "post"){
        filtered = filtered.filter((report) => report.type === "post");
      } else if(currentFilter === "comment"){
        filtered = filtered.filter((report) => report.type === "comment");
      }

      if(keyword){
        filtered = filtered.filter((report) => getSearchTarget(report).includes(keyword));
      }

      return filtered;
    }

    function updateSelectedCount(){
      const count = selectedReportIds.size;
      selectedCountText.innerText = "선택 " + count + "개";

      const disabled = count === 0;
      bulkDoneBtn.disabled = disabled;
      bulkTargetBtn.disabled = disabled;
      bulkReportBtn.disabled = disabled;
    }

    function cleanSelectedReports(){
      const validIds = new Set(allReports.map((report) => report.id));
      selectedReportIds = new Set(
        Array.from(selectedReportIds).filter((id) => validIds.has(id))
      );
      updateSelectedCount();
    }

    window.toggleReportSelection = function(reportId){
      if(selectedReportIds.has(reportId)){
        selectedReportIds.delete(reportId);
      } else {
        selectedReportIds.add(reportId);
      }

      renderReports();
    };

    window.selectVisibleReports = function(){
      visibleReports.forEach((report) => {
        selectedReportIds.add(report.id);
      });

      renderReports();
    };

    window.clearSelectedReports = function(){
      selectedReportIds.clear();
      renderReports();
    };

    window.setFilter = function(filter){
      currentFilter = filter;

      document.querySelectorAll(".tab-btn").forEach((button) => {
        button.classList.toggle("active", button.dataset.filter === filter);
      });

      renderReports();
    };

    window.loadReports = async function(){
      reportsList.innerHTML = `
        <div class="loading">
          신고 목록을 불러오는 중이에요.
        </div>
      `;

      try{
        const reportsQuery = query(
          collection(db, "reports"),
          orderBy("createdAt", "desc")
        );

        const snapshot = await getDocs(reportsQuery);
        allReports = [];

        snapshot.forEach((reportDoc) => {
          allReports.push({
            id: reportDoc.id,
            ...reportDoc.data()
          });
        });

        rebuildGroupCountMap();
        cleanSelectedReports();
        updateSummary();
        renderReports();
      } catch(error){
        console.error(error);
        reportsList.innerHTML = `
          <div class="empty">
            신고 목록을 불러오지 못했어요.<br>
            ${escapeHTML(error.message)}
          </div>
        `;
      }
    };

    function updateSummary(){
      const total = allReports.length;
      const pending = allReports.filter((item) => getStatus(item) === "pending").length;
      const accumulated = allReports.filter((item) => isAccumulatedReport(item)).length;
      const autoDeleted = allReports.filter((item) => getStatus(item) === "auto_deleted").length;
      const done = allReports.filter((item) => getStatus(item) === "done" || getStatus(item) === "target_deleted").length;

      totalCount.innerText = total;
      pendingCount.innerText = pending;
      accumulatedCount.innerText = accumulated;
      autoDeletedCount.innerText = autoDeleted;
      doneCount.innerText = done;
    }

    function renderReports(){
      visibleReports = getFilteredReports();
      updateSelectedCount();

      if(visibleReports.length === 0){
        reportsList.innerHTML = `
          <div class="empty">
            표시할 신고가 없어요.
          </div>
        `;
        return;
      }

      reportsList.innerHTML = "";

      visibleReports.forEach((report) => {
        const status = getStatus(report);
        const groupCount = getReportGroupCount(report);
        const isSelected = selectedReportIds.has(report.id);
        const reportCard = document.createElement("div");
        reportCard.className = "report-card" + (isSelected ? " selected" : "");

        const typeClass = report.type === "comment" ? "comment" : "post";
        const typeText = report.type === "comment" ? "댓글 신고" : "게시글 신고";
        const targetText = getTargetText(report);
        const postLink = report.postId ? `detail.html?id=${encodeURIComponent(report.postId)}` : "home.html";
        const countBadgeClass = groupCount >= 3 ? "count-badge hot" : "count-badge";

        reportCard.innerHTML = `
          <div class="report-head">
            <div class="report-left">
              <input
                type="checkbox"
                class="select-box"
                ${isSelected ? "checked" : ""}
                aria-label="신고 선택"
              >

              <div class="report-main">
                <div class="report-type-row">
                  <span class="type-badge ${typeClass}">${typeText}</span>
                  <span class="status-badge ${getStatusClass(status)}">${getStatusText(status)}</span>
                  <span class="${countBadgeClass}">누적 ${groupCount}회</span>
                </div>

                <div class="report-title">
                  ${escapeHTML(getMainTitle(report))}
                </div>
              </div>
            </div>

            <div class="report-date">
              ${escapeHTML(getDateText(report.createdAt))}
            </div>
          </div>

          <div class="meta-grid">
            <div class="meta-item">
              <div class="meta-label">신고자</div>
              <div class="meta-value">
                ${escapeHTML(report.reporterNickname || "알 수 없음")}<br>
                ${escapeHTML(report.reporterEmail || report.reporterId || "-")}
              </div>
            </div>

            <div class="meta-item">
              <div class="meta-label">신고 대상 작성자</div>
              <div class="meta-value">
                ${escapeHTML(report.targetNickname || "알 수 없음")}<br>
                ${escapeHTML(report.targetUserId || "-")}
              </div>
            </div>

            <div class="meta-item">
              <div class="meta-label">게시글 ID</div>
              <div class="meta-value">${escapeHTML(report.postId || "-")}</div>
            </div>

            <div class="meta-item">
              <div class="meta-label">댓글 ID</div>
              <div class="meta-value">${escapeHTML(report.commentId || "-")}</div>
            </div>
          </div>

          <div class="section-title">신고 사유</div>
          <div class="text-box">${escapeHTML(report.reason || "사유 없음")}</div>

          <div class="section-title">신고된 내용</div>
          <div class="text-box">${escapeHTML(targetText)}</div>

          <div class="btn-wrap">
            <button class="action-btn view-btn" type="button">게시글 보기</button>
            <button class="action-btn done-btn" type="button">처리완료</button>
            <button class="action-btn delete-target-btn" type="button">대상 삭제</button>
            <button class="action-btn delete-report-btn" type="button">신고기록 삭제</button>
          </div>
        `;

        const checkbox = reportCard.querySelector(".select-box");
        const viewButton = reportCard.querySelector(".view-btn");
        const doneButton = reportCard.querySelector(".done-btn");
        const targetButton = reportCard.querySelector(".delete-target-btn");
        const reportButton = reportCard.querySelector(".delete-report-btn");

        checkbox.addEventListener("change", () => toggleReportSelection(report.id));
        viewButton.addEventListener("click", () => location.href = postLink);
        doneButton.addEventListener("click", () => markDone(report.id));
        targetButton.addEventListener("click", () => deleteTarget(report.id, report.type || "", report.postId || "", report.commentId || ""));
        reportButton.addEventListener("click", () => deleteReport(report.id));

        reportsList.appendChild(reportCard);
      });
    }

    window.markDone = async function(reportId){
      const ok = confirm("이 신고를 처리완료로 바꿀까요?");
      if(!ok) return;

      try{
        await updateDoc(doc(db, "reports", reportId), {
          status: "done",
          handledAt: new Date()
        });

        alert("처리완료로 변경했어요.");
        await loadReports();
      } catch(error){
        alert("처리 중 오류가 발생했어요.\n" + error.message);
      }
    };

    window.deleteTarget = async function(reportId, type, postId, commentId){
      const ok = confirm("신고 대상을 실제로 삭제할까요?\n삭제 후 이 신고는 대상삭제 상태로 남겨둘게요.");
      if(!ok) return;

      try{
        await deleteOneTarget(type, postId, commentId);

        await updateDoc(doc(db, "reports", reportId), {
          status: "target_deleted",
          handledAt: new Date()
        });

        alert("대상을 삭제했고 신고 기록은 남겨뒀어요.");
        await loadReports();
      } catch(error){
        alert("삭제 중 오류가 발생했어요.\n" + error.message);
      }
    };

    async function deleteOneTarget(type, postId, commentId){
      if(!postId){
        return;
      }

      if(type === "post"){
        await deleteDoc(doc(db, "posts", postId));
        return;
      }

      if(type === "comment" && commentId){
        await deleteDoc(doc(db, "posts", postId, "comments", commentId));

        try{
          const postSnap = await getDoc(doc(db, "posts", postId));

          if(postSnap.exists()){
            await updateDoc(doc(db, "posts", postId), {
              commentCount: increment(-1)
            });
          }
        } catch(error){
          console.log("댓글 수 조정 실패:", error.message);
        }
      }
    }

    window.deleteReport = async function(reportId){
      const ok = confirm("신고 기록 자체를 삭제할까요?\n관리 기록이 사라집니다.");
      if(!ok) return;

      try{
        await deleteDoc(doc(db, "reports", reportId));
        selectedReportIds.delete(reportId);
        alert("신고 기록을 삭제했어요.");
        await loadReports();
      } catch(error){
        alert("삭제 중 오류가 발생했어요.\n" + error.message);
      }
    };

    window.bulkMarkDone = async function(){
      const selectedIds = Array.from(selectedReportIds);

      if(selectedIds.length === 0){
        alert("선택된 신고가 없어요.");
        return;
      }

      const ok = confirm("선택한 신고 " + selectedIds.length + "개를 처리완료로 바꿀까요?");
      if(!ok) return;

      try{
        const batch = writeBatch(db);

        selectedIds.forEach((reportId) => {
          batch.update(doc(db, "reports", reportId), {
            status: "done",
            handledAt: new Date()
          });
        });

        await batch.commit();
        selectedReportIds.clear();
        alert("선택한 신고를 처리완료로 변경했어요.");
        await loadReports();
      } catch(error){
        alert("일괄 처리 중 오류가 발생했어요.\n" + error.message);
      }
    };

    window.bulkDeleteReports = async function(){
      const selectedIds = Array.from(selectedReportIds);

      if(selectedIds.length === 0){
        alert("선택된 신고가 없어요.");
        return;
      }

      const ok = confirm("선택한 신고 기록 " + selectedIds.length + "개를 삭제할까요?\n관리 기록이 사라집니다.");
      if(!ok) return;

      try{
        const batch = writeBatch(db);

        selectedIds.forEach((reportId) => {
          batch.delete(doc(db, "reports", reportId));
        });

        await batch.commit();
        selectedReportIds.clear();
        alert("선택한 신고 기록을 삭제했어요.");
        await loadReports();
      } catch(error){
        alert("일괄 삭제 중 오류가 발생했어요.\n" + error.message);
      }
    };

    window.bulkDeleteTargets = async function(){
      const selectedIds = Array.from(selectedReportIds);

      if(selectedIds.length === 0){
        alert("선택된 신고가 없어요.");
        return;
      }

      const selectedReports = selectedIds
        .map((id) => getReportById(id))
        .filter(Boolean);

      const targetMap = {};

      selectedReports.forEach((report) => {
        const key = getReportKey(report);
        if(!targetMap[key]){
          targetMap[key] = report;
        }
      });

      const targetCount = Object.keys(targetMap).length;

      const ok = confirm(
        "선택한 신고 " + selectedReports.length + "개와 연결된 대상 " + targetCount + "개를 실제로 삭제할까요?\n" +
        "삭제 후 선택한 신고들은 대상삭제 상태로 남겨둘게요."
      );

      if(!ok) return;

      try{
        for(const key in targetMap){
          const report = targetMap[key];
          await deleteOneTarget(report.type || "", report.postId || "", report.commentId || "");
        }

        const batch = writeBatch(db);

        selectedReports.forEach((report) => {
          batch.update(doc(db, "reports", report.id), {
            status: "target_deleted",
            handledAt: new Date()
          });
        });

        await batch.commit();
        selectedReportIds.clear();
        alert("선택한 신고 대상을 삭제했고, 신고 기록은 대상삭제로 변경했어요.");
        await loadReports();
      } catch(error){
        alert("일괄 대상삭제 중 오류가 발생했어요.\n" + error.message);
      } 
    };
  </script>


</body>
