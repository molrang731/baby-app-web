<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>사용자 프로필 - 오늘도육아</title>

  <style>

    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    :root{
      --bg:#fff7fb;--bg2:#ffeaf2;--text:#241f21;--sub:#5f5357;--muted:#8d7c83;
      --card:#fff;--header:rgba(255,255,255,.94);--line:#f3dfe7;--soft:#fff7fa;
      --soft2:#fff0f5;--point:#ff5c8a;--point2:#ffd6e7;--shadow:rgba(255,92,138,.09);
      --bottom:rgba(255,255,255,.97);
    }
    body.dark-mode{
      --bg:#181216;--bg2:#24161d;--text:#fff6fa;--sub:#f5e8ee;--muted:#c9aeb9;
      --card:#261b22;--header:rgba(28,20,25,.94);--line:#4a303b;--soft:#2f2028;
      --soft2:#3a2430;--point:#ff8fb1;--point2:#5b3747;--shadow:rgba(0,0,0,.25);
      --bottom:rgba(34,24,30,.96);
    }
    html,body{width:100%;min-height:100%;}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;
      background:var(--bg);color:var(--text);padding-bottom:112px;overflow-x:hidden;
    }
    button{font-family:inherit;cursor:pointer;}

    .header{
      position:sticky;top:0;z-index:100;background:var(--header);
      backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
      border-bottom:1px solid var(--line);box-shadow:0 4px 18px var(--shadow);
    }
    .header-inner{
      width:100%;max-width:430px;margin:0 auto;padding:13px 16px;
      display:flex;justify-content:space-between;align-items:center;gap:10px;
    }
    .brand{
      display:flex;align-items:center;gap:10px;font-size:21px;font-weight:900;
      color:var(--point);letter-spacing:-.7px;white-space:nowrap;
    }
    .mini-logo{
      width:19px;height:19px;border-radius:50%;background:var(--point);
      position:relative;display:inline-block;flex-shrink:0;
    }
    .mini-logo::after{
      content:'';position:absolute;width:19px;height:19px;border-radius:50%;
      background:var(--bg2);top:-2px;left:7px;
    }
    .header-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
    .theme-toggle,.back-link{
      min-width:38px;height:38px;border-radius:999px;background:var(--card);
      color:var(--point);border:1px solid var(--point2);box-shadow:0 8px 22px var(--shadow);
      display:flex;align-items:center;justify-content:center;text-decoration:none;
      font-size:12px;font-weight:900;white-space:nowrap;
    }
    .theme-toggle{font-size:17px;padding:0 11px;}
    .back-link{padding:0 12px;}

    .container{width:100%;max-width:430px;margin:0 auto;padding:14px 13px 22px;}
    .profile-hero,.activity-card{
      background:var(--card);border:1px solid var(--line);border-radius:24px;
      overflow:hidden;box-shadow:0 10px 24px var(--shadow);margin-bottom:14px;
    }
    .cover{
      height:104px;position:relative;
      background:
        radial-gradient(circle at 18% 22%,rgba(255,255,255,.72) 0 10%,transparent 11%),
        radial-gradient(circle at 78% 18%,rgba(255,255,255,.45) 0 8%,transparent 9%),
        linear-gradient(135deg,#ff8fb1,var(--point2));
    }
    body.dark-mode .cover{
      background:linear-gradient(135deg,#402833,#5b3445);
    }
    .cover-label,.visibility-badge{
      position:absolute;top:14px;border-radius:999px;padding:7px 10px;
      background:rgba(255,255,255,.78);color:var(--point);
      border:1px solid rgba(255,255,255,.35);font-size:11px;font-weight:900;
      backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    }
    body.dark-mode .cover-label,body.dark-mode .visibility-badge{background:rgba(58,36,48,.86);}
    .cover-label{left:14px;}
    .visibility-badge{right:14px;}

    .profile-main{
      padding:0 15px 16px;text-align:center;margin-top:-42px;position:relative;z-index:2;
    }
    .profile-photo{
      width:100px;height:100px;border-radius:36px;margin:0 auto 12px;
      background:linear-gradient(135deg,var(--soft2),var(--point2));
      display:flex;align-items:center;justify-content:center;color:var(--point);
      font-size:38px;font-weight:900;overflow:hidden;border:5px solid var(--card);
      box-shadow:0 14px 30px var(--shadow);
    }
    .profile-photo img,.mini-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
    .nickname{
      font-size:24px;font-weight:900;letter-spacing:-.8px;margin-bottom:7px;
      color:var(--text);word-break:keep-all;overflow-wrap:anywhere;
    }
    .stage{
      display:inline-flex;align-items:center;gap:5px;background:var(--soft2);
      color:var(--point);padding:7px 12px;border-radius:999px;
      font-size:12.5px;font-weight:900;margin-bottom:12px;border:1px solid var(--point2);
    }
    .status{
      color:var(--sub);line-height:1.65;font-size:13.5px;background:var(--soft);
      border:1px solid var(--line);border-radius:20px;padding:13px;text-align:left;
      white-space:pre-line;margin-bottom:13px;word-break:break-word;overflow-wrap:anywhere;
    }
    .stats{
      display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:2px;
    }
    .stat{
      background:var(--soft);border:1px solid var(--line);border-radius:18px;
      padding:12px 4px;text-align:center;
    }
    .stat strong{display:block;color:var(--text);font-size:20px;margin-bottom:4px;letter-spacing:-.4px;}
    .stat span{color:var(--muted);font-size:11.5px;font-weight:900;}

    .activity-card{padding:16px 14px;}
    .edit-title{font-size:18px;font-weight:900;margin-bottom:6px;color:var(--text);letter-spacing:-.5px;}
    .edit-sub{color:var(--muted);font-size:13px;line-height:1.5;margin-bottom:12px;}
    .tab-row{
      display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:var(--soft);
      padding:5px;border-radius:999px;border:1px solid var(--line);margin:12px 0 13px;
    }
    .tab-btn{
      width:100%;border:none;border-radius:999px;background:transparent;color:var(--muted);
      padding:10px 4px;font-size:11.8px;font-weight:900;white-space:nowrap;
    }
    .tab-btn.active{background:var(--point);color:#fff;box-shadow:0 8px 20px rgba(255,92,138,.18);}
    .mini-post-list{display:flex;flex-direction:column;gap:9px;}
    .mini-post{
      display:flex;gap:10px;background:var(--soft);border:1px solid var(--line);
      border-radius:18px;padding:10px;cursor:pointer;
    }
    .mini-post:active,.more-btn:active,.tab-btn:active,.theme-toggle:active,.back-link:active{transform:scale(.99);}
    .mini-thumb{
      width:62px;height:62px;border-radius:16px;flex-shrink:0;overflow:hidden;
      display:flex;align-items:center;justify-content:center;color:var(--point);
      font-size:22px;font-weight:900;background:linear-gradient(135deg,var(--soft2),var(--point2));
    }
    .mini-info{min-width:0;flex:1;}
    .mini-category{
      display:inline-block;color:var(--point);background:var(--card);border:1px solid var(--point2);
      padding:4px 8px;border-radius:999px;font-size:10.5px;font-weight:900;margin-bottom:5px;
    }
    .mini-title{
      color:var(--text);font-size:13.5px;font-weight:900;line-height:1.35;margin-bottom:5px;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;overflow-wrap:anywhere;
    }
    .mini-meta{color:var(--muted);font-size:11px;font-weight:800;display:flex;gap:6px;flex-wrap:wrap;}
    .more-btn{
      width:100%;margin-top:10px;padding:12px;border-radius:18px;background:var(--card);
      color:var(--point);border:1px solid var(--point2);font-size:13px;font-weight:900;
      box-shadow:0 8px 18px var(--shadow);
    }
    .empty{
      background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:22px 14px;
      text-align:center;color:var(--muted);font-size:13px;line-height:1.7;
    }


    .bottom-menu{position:fixed;left:0;bottom:14px;width:100%;z-index:999;padding:0 14px env(safe-area-inset-bottom);pointer-events:none;}
    .bottom-inner{width:100%;max-width:430px;height:78px;margin:0 auto;display:flex;justify-content:space-around;align-items:center;background:var(--bottom);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:30px;box-shadow:0 14px 34px var(--shadow);pointer-events:auto;}
    .bottom-menu a,.menu-item{width:25%;height:100%;text-decoration:none;color:#7d6c72;font-size:12px;text-align:center;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;transition:.18s ease;}
    .bottom-menu a:active,.menu-item:active{transform:scale(.96);}
    .menu-icon{width:45px;height:45px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:currentColor;position:relative;transition:.18s ease;}
    .menu-icon svg{width:26px;height:26px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;display:block;}
    .bottom-menu a.active,.menu-item.active{color:var(--point);}
    .bottom-menu a.active .menu-icon,.menu-item.active .menu-icon{background:var(--soft2);box-shadow:0 8px 18px var(--shadow);transform:translateY(-2px);}
    .menu-icon.home-icon::after{content:'❤';position:absolute;top:-6px;right:1px;width:17px;height:17px;border-radius:50%;background:#ff8fb1;color:#fff;font-size:10px;line-height:17px;text-align:center;box-shadow:0 5px 12px rgba(255,92,138,.22);}
    .menu-item span{line-height:1;letter-spacing:-.35px;}
    .notification-link,.notification-icon{position:relative;}
    .notification-badge{position:absolute;top:-6px;right:-7px;min-width:18px;height:18px;padding:0 5px;background:#ff2f6d;color:#fff;border-radius:999px;font-size:10px;font-weight:900;line-height:18px;text-align:center;display:none;box-shadow:0 4px 10px rgba(255,47,109,.35);border:2px solid var(--card);}
    body.dark-mode .bottom-menu a,body.dark-mode .menu-item,body.dark-mode .menu-icon{color:#c9aeb9;}
    body.dark-mode .bottom-menu a.active,body.dark-mode .menu-item.active,body.dark-mode .menu-item.active .menu-icon{color:var(--point);}

    @media(max-width:390px){
      .container{padding-left:11px;padding-right:11px;}
      .header-inner{padding-left:16px;padding-right:16px;}
      .brand{font-size:20px;}
      .profile-hero,.activity-card{border-radius:22px;}
      .cover{height:96px;}
      .profile-main{margin-top:-39px;padding-left:13px;padding-right:13px;}
      .profile-photo{width:94px;height:94px;border-radius:34px;font-size:36px;}
      .nickname{font-size:23px;}
      .stat strong{font-size:19px;}
      .stat span{font-size:11px;}
      .activity-card{padding-left:13px;padding-right:13px;}
      .tab-btn{font-size:11px;padding:9px 2px;}
      .mini-thumb{width:58px;height:58px;border-radius:15px;}
    }

  </style>
</head>

<body>

  <div class="header">
    <div class="header-inner">
      <div class="brand">
        <span class="mini-logo"></span>
        오늘도육아
      </div>

      <div class="header-actions">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="다크모드 전환">🌙</button>
        <a href="home.html" class="back-link">홈으로</a>
      </div>
    </div>
  </div>

  <div class="container">

    <div class="profile-hero">
      <div class="cover">
        <div class="cover-label">USER PROFILE</div>
        <div class="visibility-badge" id="visibilityBadge">공개</div>
      </div>

      <div class="profile-main">
        <div class="profile-photo" id="profilePhoto">?</div>

        <div class="nickname" id="nickname">불러오는 중...</div>
        <div class="stage" id="stageBadge">육아 단계</div>

        <div class="status" id="statusText">상태메시지가 아직 없어요.</div>

        <div class="stats">
          <div class="stat">
            <strong id="postCount">0</strong>
            <span>작성글</span>
          </div>

          <div class="stat">
            <strong id="likeCount">0</strong>
            <span>받은공감</span>
          </div>

          <div class="stat">
            <strong id="likedPostCount">0</strong>
            <span>공감한글</span>
          </div>
        </div>
      </div>
    </div>

    <div class="activity-card">
      <div class="edit-title" id="activityTitle">활동</div>
      <div class="edit-sub" id="activitySub">
        이 사용자가 남긴 육아 이야기와 공감한 글을 볼 수 있어요.
      </div>

      <div class="tab-row" id="tabRow">
        <button class="tab-btn active" id="writtenTab" type="button">작성글</button>
        <button class="tab-btn" id="receivedTab" type="button">받은공감</button>
        <button class="tab-btn" id="likedTab" type="button">공감한글</button>
      </div>

      <div class="mini-post-list" id="activityList">
        <div class="empty">활동을 불러오는 중이에요.</div>
      </div>
    </div>

  </div>

  <div class="bottom-menu">
    <div class="bottom-inner">
      <a href="home.html" class="menu-item" aria-label="홈">
        <div class="menu-icon home-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.5 11.2 12 4l8.5 7.2"></path>
            <path d="M5.7 10.4v8.3c0 .8.6 1.4 1.4 1.4h3.1v-5.4h3.6v5.4h3.1c.8 0 1.4-.6 1.4-1.4v-8.3"></path>
          </svg>
        </div>
        <span>홈</span>
      </a>

      <a href="write.html" class="menu-item" aria-label="글쓰기">
        <div class="menu-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 20h4.6L19.2 9.4a2.4 2.4 0 0 0 0-3.4L18 4.8a2.4 2.4 0 0 0-3.4 0L4 15.4V20z"></path>
            <path d="M13.7 5.7l4.6 4.6"></path>
            <path d="M4 15.4 8.6 20"></path>
          </svg>
        </div>
        <span>글쓰기</span>
      </a>

      <a href="notifications.html" class="menu-item notification-link" aria-label="알림">
        <div class="menu-icon notification-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18.2 9.8a6.2 6.2 0 0 0-12.4 0c0 7-2.4 7.7-2.4 7.7h17.2s-2.4-.7-2.4-7.7z"></path>
            <path d="M9.8 20.1a2.6 2.6 0 0 0 4.4 0"></path>
          </svg>
          <span id="notificationBadge" class="notification-badge"></span>
        </div>
        <span>알림</span>
      </a>

      <a href="profile.html" class="menu-item active" aria-label="내정보">
        <div class="menu-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 12.3a4.2 4.2 0 1 0 0-8.4 4.2 4.2 0 0 0 0 8.4z"></path>
            <path d="M4.4 20.2c1.2-3.5 4-5.3 7.6-5.3s6.4 1.8 7.6 5.3"></path>
          </svg>
        </div>
        <span>내정보</span>
      </a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      collection,
      getDocs,
      query,
      where,
      orderBy,
      limit,
      startAfter,
      getCountFromServer,
      getAggregateFromServer,
      sum,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD4x9d4aQlbroxcnT2v-zHODDPdQabIFx0",
      authDomain: "today-parenting-app.firebaseapp.com",
      projectId: "today-parenting-app",
      storageBucket: "today-parenting-app.firebasestorage.app",
      messagingSenderId: "375329953167",
      appId: "1:375329953167:web:d29af0e45cc7d10e9f67fa"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const params = new URLSearchParams(window.location.search);
    const targetUid = params.get("uid");

    const profilePhoto = document.getElementById("profilePhoto");
    const nicknameEl = document.getElementById("nickname");
    const stageBadge = document.getElementById("stageBadge");
    const statusText = document.getElementById("statusText");
    const visibilityBadge = document.getElementById("visibilityBadge");

    const postCount = document.getElementById("postCount");
    const likeCount = document.getElementById("likeCount");
    const likedPostCount = document.getElementById("likedPostCount");

    const activityTitle = document.getElementById("activityTitle");
    const activitySub = document.getElementById("activitySub");
    const activityList = document.getElementById("activityList");
    const tabRow = document.getElementById("tabRow");
    const writtenTab = document.getElementById("writtenTab");
    const receivedTab = document.getElementById("receivedTab");
    const likedTab = document.getElementById("likedTab");
    const notificationBadge = document.getElementById("notificationBadge");
    const themeToggle = document.getElementById("themeToggle");

    let currentUser = null;
    let targetUser = null;
    let notificationBadgeUnsubscribe = null;
    let currentTab = "written";

    const activitiesPerPage = 8;

    const activityState = {
      written: {
        posts: [],
        lastVisible: null,
        hasMore: true,
        isLoading: false,
        loaded: false
      },
      received: {
        posts: [],
        lastVisible: null,
        hasMore: true,
        isLoading: false,
        loaded: false
      },
      liked: {
        posts: [],
        lastVisible: null,
        hasMore: true,
        isLoading: false,
        loaded: false
      }
    };

    initTheme();

    if(!targetUid){
      activityList.innerHTML = `
        <div class="empty">
          사용자 정보를 찾을 수 없어요.
        </div>
      `;
      tabRow.style.display = "none";
    }

    onAuthStateChanged(auth, async (user) => {
      if(!user){
        alert("로그인이 필요합니다.");
        window.location.href = "index.html";
        return;
      }

      currentUser = user;
      startNotificationBadge(user.uid);

      if(!targetUid){
        return;
      }

      if(targetUid === currentUser.uid){
        window.location.href = "profile.html";
        return;
      }

      try{
        await ensureMyUserDoc();
        await loadUserProfile();
      } catch(error){
        activityList.innerHTML = `
          <div class="empty">
            정보를 불러오지 못했어요.<br>
            ${escapeHTML(error.message)}
          </div>
        `;
      }
    });

    function initTheme(){
      const savedTheme =
        localStorage.getItem("theme") ||
        localStorage.getItem("colorTheme") ||
        localStorage.getItem("todayParentingTheme");

      const isDark = savedTheme === "dark";

      document.body.classList.toggle("dark-mode", isDark);
      updateThemeIcon(isDark);

      themeToggle.addEventListener("click", () => {
        const nextDark = !document.body.classList.contains("dark-mode");

        document.body.classList.toggle("dark-mode", nextDark);

        localStorage.setItem("theme", nextDark ? "dark" : "light");
        localStorage.setItem("colorTheme", nextDark ? "dark" : "light");
        localStorage.setItem("todayParentingTheme", nextDark ? "dark" : "light");

        updateThemeIcon(nextDark);
      });
    }

    function updateThemeIcon(isDark){
      themeToggle.innerText = isDark ? "☀️" : "🌙";
      themeToggle.setAttribute("aria-label", isDark ? "주간모드로 전환" : "야간모드로 전환");
    }

    function startNotificationBadge(uid){
      if(!notificationBadge || !uid){
        return;
      }

      if(notificationBadgeUnsubscribe){
        notificationBadgeUnsubscribe();
      }

      const badgeQuery = query(
        collection(db, "notifications"),
        where("receiverId", "==", uid),
        where("isRead", "==", false)
      );

      notificationBadgeUnsubscribe = onSnapshot(badgeQuery, (snapshot) => {
        const count = snapshot.size;

        if(count > 0){
          notificationBadge.style.display = "flex";
          notificationBadge.innerText = count > 99 ? "99+" : count;
        } else {
          notificationBadge.style.display = "none";
          notificationBadge.innerText = "";
        }
      }, (error) => {
        console.log("알림 뱃지 오류:", error.message);
      });
    }

    async function ensureMyUserDoc(){
      const myRef = doc(db, "users", currentUser.uid);
      const myDoc = await getDoc(myRef);

      if(!myDoc.exists()){
        await setDoc(myRef, {
          nickname: currentUser.displayName || currentUser.email || "사용자",
          email: currentUser.email || "",
          createdAt: new Date()
        }, { merge:true });
      }
    }

    function escapeHTML(text){
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getPostDate(createdAt){
      if(!createdAt){
        return new Date(0);
      }

      if(createdAt.toDate){
        return createdAt.toDate();
      }

      return new Date(createdAt);
    }

    function getTimeText(createdAt){
      const postDate = getPostDate(createdAt);

      if(postDate.getTime() === 0){
        return "방금 전";
      }

      const now = new Date();
      const diff = now - postDate;

      const minute = 60 * 1000;
      const hour = 60 * minute;
      const day = 24 * hour;

      if(diff < minute){
        return "방금 전";
      }

      if(diff < hour){
        return Math.floor(diff / minute) + "분 전";
      }

      if(diff < day){
        return Math.floor(diff / hour) + "시간 전";
      }

      if(diff < day * 7){
        return Math.floor(diff / day) + "일 전";
      }

      return postDate.getFullYear() + "." +
        String(postDate.getMonth() + 1).padStart(2, "0") + "." +
        String(postDate.getDate()).padStart(2, "0");
    }

    function getPostImages(post){
      if(Array.isArray(post.imageUrls) && post.imageUrls.length > 0){
        return post.imageUrls.filter((url) => url);
      }

      if(post.imageUrl){
        return [post.imageUrl];
      }

      return [];
    }

    function getThumbHtml(post){
      const images = getPostImages(post);

      if(images.length > 0){
        return `<img src="${escapeHTML(images[0])}" alt="게시글 이미지" loading="lazy" decoding="async">`;
      }

      return "💬";
    }

    function getLikeNumber(post){
      if(typeof post.likes === "number"){
        return post.likes;
      }

      return 0;
    }

    async function loadUserProfile(){
      const userRef = doc(db, "users", targetUid);
      const userSnap = await getDoc(userRef);

      if(!userSnap.exists()){
        activityList.innerHTML = `
          <div class="empty">
            존재하지 않는 사용자예요.
          </div>
        `;
        tabRow.style.display = "none";
        return;
      }

      targetUser = userSnap.data();

      const nickname = targetUser.nickname || "사용자";
      const stage = targetUser.stage || "육아 중";
      const photoURL = targetUser.photoURL || targetUser.photoUrl || "";
      const status = targetUser.status || "상태메시지가 아직 없어요.";
      const visibility = targetUser.profileVisibility || "public";

      nicknameEl.innerText = nickname;
      stageBadge.innerText = "🌷 " + stage + " 부모";
      statusText.innerText = status;
      visibilityBadge.innerText = visibility === "private" ? "비공개" : "공개";

      if(photoURL){
        profilePhoto.innerHTML = `<img src="${escapeHTML(photoURL)}" alt="프로필 사진">`;
      } else {
        profilePhoto.innerText = nickname.charAt(0);
      }

      if(visibility === "private"){
        postCount.innerText = "-";
        likeCount.innerText = "-";
        likedPostCount.innerText = "-";

        tabRow.style.display = "none";
        activityTitle.innerText = "활동";
        activitySub.innerText = "이 사용자는 활동을 비공개로 설정했어요.";

        activityList.innerHTML = `
          <div class="empty">
            🔒 비공개 프로필이에요.<br>
            활동을 볼 수 없어요.
          </div>
        `;

        return;
      }

      tabRow.style.display = "grid";
      await loadStats();
      await loadActivityFirst("written");
    }

    async function loadStats(){
      try{
        const writtenCountQuery = query(
          collection(db, "posts"),
          where("userId", "==", targetUid)
        );

        const likedCountQuery = query(
          collection(db, "posts"),
          where("likedBy", "array-contains", targetUid)
        );

        const writtenCountSnapshot = await getCountFromServer(writtenCountQuery);
        const likedCountSnapshot = await getCountFromServer(likedCountQuery);

        postCount.innerText = writtenCountSnapshot.data().count || 0;
        likedPostCount.innerText = likedCountSnapshot.data().count || 0;

        try{
          const likeSumSnapshot = await getAggregateFromServer(writtenCountQuery, {
            totalLikes: sum("likes")
          });

          likeCount.innerText = likeSumSnapshot.data().totalLikes || 0;
        } catch(sumError){
          likeCount.innerText = "-";
        }

      } catch(error){
        postCount.innerText = "-";
        likeCount.innerText = "-";
        likedPostCount.innerText = "-";
      }
    }

    function getActivityQuery(tabName){
      const state = activityState[tabName];

      if(tabName === "received"){
        if(state.lastVisible){
          return query(
            collection(db, "posts"),
            where("userId", "==", targetUid),
            orderBy("likes", "desc"),
            orderBy("createdAt", "desc"),
            startAfter(state.lastVisible),
            limit(activitiesPerPage)
          );
        }

        return query(
          collection(db, "posts"),
          where("userId", "==", targetUid),
          orderBy("likes", "desc"),
          orderBy("createdAt", "desc"),
          limit(activitiesPerPage)
        );
      }

      if(tabName === "liked"){
        if(state.lastVisible){
          return query(
            collection(db, "posts"),
            where("likedBy", "array-contains", targetUid),
            orderBy("createdAt", "desc"),
            startAfter(state.lastVisible),
            limit(activitiesPerPage)
          );
        }

        return query(
          collection(db, "posts"),
          where("likedBy", "array-contains", targetUid),
          orderBy("createdAt", "desc"),
          limit(activitiesPerPage)
        );
      }

      if(state.lastVisible){
        return query(
          collection(db, "posts"),
          where("userId", "==", targetUid),
          orderBy("createdAt", "desc"),
          startAfter(state.lastVisible),
          limit(activitiesPerPage)
        );
      }

      return query(
        collection(db, "posts"),
        where("userId", "==", targetUid),
        orderBy("createdAt", "desc"),
        limit(activitiesPerPage)
      );
    }

    async function loadActivityFirst(tabName){
      currentTab = tabName;
      setTabButtonActive(tabName);
      updateActivityText();

      const state = activityState[tabName];

      if(state.loaded){
        renderActivityList();
        return;
      }

      activityList.innerHTML = `
        <div class="empty">
          활동을 불러오는 중이에요.
        </div>
      `;

      await loadMoreActivity(tabName);
    }

    async function loadMoreActivity(tabName = currentTab){
      const state = activityState[tabName];

      if(state.isLoading || !state.hasMore){
        return;
      }

      state.isLoading = true;
      currentTab = tabName;
      updateActivityText();

      try{
        const activityQuery = getActivityQuery(tabName);
        const snapshot = await getDocs(activityQuery);

        state.loaded = true;

        if(snapshot.empty){
          state.hasMore = false;
          renderActivityList();
          return;
        }

        state.lastVisible = snapshot.docs[snapshot.docs.length - 1];

        snapshot.forEach((postDoc) => {
          const exists = state.posts.some((item) => item.id === postDoc.id);

          if(!exists){
            state.posts.push({
              id: postDoc.id,
              data: postDoc.data()
            });
          }
        });

        if(snapshot.docs.length < activitiesPerPage){
          state.hasMore = false;
        }

        renderActivityList();

      } catch(error){
        activityList.innerHTML = `
          <div class="empty">
            활동을 불러오지 못했어요.<br>
            ${escapeHTML(error.message)}<br><br>
            Firestore 인덱스가 필요하면 콘솔에 뜨는 링크로 인덱스를 만들어주세요.
          </div>
        `;
      } finally {
        state.isLoading = false;
      }
    }

    function setTabButtonActive(tabName){
      writtenTab.classList.toggle("active", tabName === "written");
      receivedTab.classList.toggle("active", tabName === "received");
      likedTab.classList.toggle("active", tabName === "liked");
    }

    function updateActivityText(){
      if(currentTab === "received"){
        activityTitle.innerText = "받은공감";
        activitySub.innerText = "이 사용자가 쓴 글 중 공감을 많이 받은 이야기를 볼 수 있어요.";
        return;
      }

      if(currentTab === "liked"){
        activityTitle.innerText = "공감한 글";
        activitySub.innerText = "이 사용자가 공감한 육아 이야기를 볼 수 있어요.";
        return;
      }

      activityTitle.innerText = "작성한 글";
      activitySub.innerText = "이 사용자가 남긴 육아 이야기를 볼 수 있어요.";
    }

    function getEmptyMessage(){
      if(currentTab === "received"){
        return "아직 공감을 받은 글이 없어요.";
      }

      if(currentTab === "liked"){
        return "아직 공감한 글이 없어요.";
      }

      return "아직 작성한 글이 없어요.";
    }

    function renderActivityList(){
      const state = activityState[currentTab];
      const list = state.posts;

      updateActivityText();
      activityList.innerHTML = "";

      if(list.length === 0){
        activityList.innerHTML = `
          <div class="empty">
            ${getEmptyMessage()}
          </div>
        `;
        return;
      }

      list.forEach((item) => {
        const post = item.data;

        activityList.innerHTML += `
          <div class="mini-post" onclick="goDetail('${item.id}')">
            <div class="mini-thumb">
              ${getThumbHtml(post)}
            </div>

            <div class="mini-info">
              <div class="mini-category">${escapeHTML(post.category || "육아")}</div>
              <div class="mini-title">${escapeHTML(post.title || "제목 없음")}</div>

              <div class="mini-meta">
                <span>♥ ${getLikeNumber(post)}</span>
                <span>댓글 ${post.commentCount || 0}</span>
                <span>조회 ${post.views || 0}</span>
                <span>${getTimeText(post.createdAt)}</span>
              </div>
            </div>
          </div>
        `;
      });

      if(state.hasMore){
        const buttonText = state.isLoading ? "불러오는 중..." : "더보기";

        activityList.innerHTML += `
          <button class="more-btn" type="button" onclick="loadMoreActivities()">
            ${buttonText}
          </button>
        `;
      }
    }

    writtenTab.addEventListener("click", () => {
      loadActivityFirst("written");
    });

    receivedTab.addEventListener("click", () => {
      loadActivityFirst("received");
    });

    likedTab.addEventListener("click", () => {
      loadActivityFirst("liked");
    });

    window.loadMoreActivities = function(){
      loadMoreActivity(currentTab);
    };

    window.goDetail = function(postId){
      window.location.href = "detail.html?id=" + encodeURIComponent(postId);
    };
  </script>

</body>
</html>
