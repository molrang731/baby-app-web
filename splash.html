<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>오늘도육아</title>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

    body{
      width:100%;
      min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;
      background:linear-gradient(135deg,#fff7fb,#ffeaf2);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      color:#241f21;
    }

    .splash{
      width:100%;
      max-width:430px;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:24px;
      position:relative;
      animation:fadeOut 0.45s ease forwards;
      animation-delay:1.85s;
    }

    .splash::before{
      content:'';
      position:absolute;
      width:300px;
      height:300px;
      border-radius:50%;
      background:#ffd6e7;
      top:-110px;
      left:-110px;
      opacity:0.55;
    }

    .splash::after{
      content:'';
      position:absolute;
      width:240px;
      height:240px;
      border-radius:50%;
      background:#ffc8dc;
      right:-90px;
      bottom:-90px;
      opacity:0.35;
    }

    .logo-wrap{
      width:190px;
      height:190px;
      border-radius:52px;
      background:rgba(255,255,255,0.72);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 22px 50px rgba(255,92,138,0.18);
      border:1px solid rgba(255,255,255,0.85);
      margin-bottom:22px;
      position:relative;
      z-index:2;
      animation:popIn 0.7s ease both;
    }

    .logo-wrap img{
      width:145px;
      height:145px;
      object-fit:contain;
      display:block;
    }

    .title{
      position:relative;
      z-index:2;
      font-size:31px;
      font-weight:900;
      color:#ff5c8a;
      letter-spacing:-1.1px;
      margin-bottom:9px;
      animation:riseIn 0.7s ease both;
      animation-delay:0.15s;
    }

    .sub{
      position:relative;
      z-index:2;
      color:#6d5f64;
      font-size:15px;
      font-weight:800;
      letter-spacing:-0.35px;
      animation:riseIn 0.7s ease both;
      animation-delay:0.28s;
    }

    .loading{
      position:absolute;
      bottom:54px;
      left:50%;
      transform:translateX(-50%);
      width:42px;
      height:4px;
      border-radius:999px;
      background:#ffd6e7;
      overflow:hidden;
      z-index:2;
    }

    .loading::after{
      content:'';
      display:block;
      width:45%;
      height:100%;
      border-radius:999px;
      background:#ff5c8a;
      animation:loadingMove 1.2s ease-in-out infinite;
    }

    @keyframes popIn{
      from{opacity:0;transform:scale(0.86) translateY(10px);}
      to{opacity:1;transform:scale(1) translateY(0);}
    }

    @keyframes riseIn{
      from{opacity:0;transform:translateY(12px);}
      to{opacity:1;transform:translateY(0);}
    }

    @keyframes fadeOut{
      to{opacity:0;transform:scale(1.015);}
    }

    @keyframes loadingMove{
      0%{transform:translateX(-120%);}
      100%{transform:translateX(260%);}
    }

    body.dark-mode{
      background:linear-gradient(135deg,#181216,#24161d);
      color:#f7edf2;
    }

    body.dark-mode .logo-wrap{
      background:rgba(38,27,34,0.82);
      border-color:#4a303b;
      box-shadow:0 22px 50px rgba(0,0,0,0.28);
    }

    body.dark-mode .title{
      color:#ff8fb1;
    }

    body.dark-mode .sub{
      color:#e9d7df;
    }

    body.dark-mode .splash::before{
      background:#573040;
      opacity:0.36;
    }

    body.dark-mode .splash::after{
      background:#7a344d;
      opacity:0.24;
    }
  </style>
</head>

<body>
  <div class="splash">
    <div class="logo-wrap">
      <img src="logo.png" alt="오늘도육아 로고">
    </div>

    <div class="title">오늘도육아</div>
    <div class="sub">오늘도 서로 기대요 💗</div>

    <div class="loading"></div>
  </div>

  <script>
    const savedTheme =
      localStorage.getItem("todayParentingTheme") ||
      localStorage.getItem("theme") ||
      localStorage.getItem("colorTheme");

    if(savedTheme === "dark"){
      document.body.classList.add("dark-mode");
    }

    setTimeout(() => {
      window.location.href = "index.html";
    }, 2300);
  </script>
</body>
</html>
