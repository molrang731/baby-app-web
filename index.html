<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>오늘도육아</title>

  <link rel="stylesheet" href="theme.css">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{width:100%;min-height:100%;}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;
      background:#fff7fb;
      color:#241f21;
      overflow-x:hidden;
    }
    button,input{font-family:inherit;}
    button{cursor:pointer;}
    a{text-decoration:none;color:inherit;}

    .app{
      width:100%;
      max-width:430px;
      min-height:100vh;
      margin:0 auto;
      padding:18px 14px 26px;
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:14px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      color:#ff5c8a;
      font-size:21px;
      font-weight:900;
      letter-spacing:-.7px;
      white-space:nowrap;
    }
    .mini-logo{
      width:19px;
      height:19px;
      border-radius:50%;
      background:#ff5c8a;
      position:relative;
      display:inline-block;
      flex-shrink:0;
    }
    .mini-logo::after{
      content:'';
      position:absolute;
      width:19px;
      height:19px;
      border-radius:50%;
      background:#ffe4ef;
      top:-2px;
      left:7px;
    }
    .top-actions{
      display:flex;
      align-items:center;
      gap:8px;
      flex-shrink:0;
    }
    .badge,
    .dark-mode-toggle{
      min-height:38px;
      padding:0 13px;
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#fff;
      color:#ff5c8a;
      border:1px solid #ffd6e7;
      box-shadow:0 8px 22px rgba(255,92,138,.08);
      font-size:12px;
      font-weight:900;
      white-space:nowrap;
    }
    .dark-mode-toggle{min-width:38px;padding:0 11px;}

    .hero{
      background:#fff;
      border:1px solid #f3dfe7;
      border-radius:24px;
      padding:18px 16px 19px;
      box-shadow:0 10px 24px rgba(255,92,138,.075);
      margin-bottom:13px;
      overflow:hidden;
      position:relative;
    }
    .hero::after{
      content:'';
      position:absolute;
      width:118px;
      height:118px;
      border-radius:50%;
      background:#ffd6e7;
      right:-42px;
      top:-46px;
      opacity:.32;
      pointer-events:none;
    }
    .tag{
      display:inline-flex;
      align-items:center;
      gap:6px;
      background:#fff0f5;
      color:#ff5c8a;
      border:1px solid #ffd6e7;
      padding:7px 11px;
      border-radius:999px;
      font-size:11.5px;
      font-weight:900;
      margin-bottom:12px;
      position:relative;
      z-index:2;
    }
    h1{
      font-size:27px;
      line-height:1.3;
      letter-spacing:-1px;
      color:#241f21;
      margin-bottom:9px;
      position:relative;
      z-index:2;
    }
    h1 span{color:#ff5c8a;}
    .desc{
      color:#7d7276;
      font-size:13.5px;
      line-height:1.62;
      font-weight:700;
      position:relative;
      z-index:2;
    }

    .category-row{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:7px;
      margin:13px 0 14px;
    }
    .category{
      background:#fff;
      border:1px solid #f3dfe7;
      border-radius:17px;
      min-height:64px;
      padding:9px 3px 8px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:5px;
      box-shadow:0 7px 16px rgba(255,92,138,.055);
    }
    .category div{font-size:19px;line-height:1;}
    .category span{
      color:#5f5357;
      font-size:10.5px;
      font-weight:900;
      white-space:nowrap;
      letter-spacing:-.3px;
    }

    .login-box{
      background:#fff;
      border:1px solid #f3dfe7;
      border-radius:24px;
      padding:18px 15px 17px;
      box-shadow:0 10px 24px rgba(255,92,138,.075);
      margin-bottom:13px;
    }
    .app-logo{
      width:70px;
      height:70px;
      border-radius:25px;
      background:linear-gradient(135deg,#fff1f6,#ffd6e7);
      position:relative;
      margin:0 auto 14px;
      box-shadow:0 12px 28px rgba(255,92,138,.16);
    }
    .moon{
      position:absolute;
      width:33px;
      height:33px;
      border-radius:50%;
      background:#ff5c8a;
      top:18px;
      left:18px;
    }
    .moon::after{
      content:'';
      position:absolute;
      width:33px;
      height:33px;
      border-radius:50%;
      background:#ffe4ef;
      top:-3px;
      left:10px;
    }
    .heart{
      position:absolute;
      right:14px;
      bottom:12px;
      color:#ff5c8a;
      font-size:17px;
      font-weight:900;
    }
    .login-box h2{
      text-align:center;
      color:#ff5c8a;
      font-size:24px;
      font-weight:900;
      letter-spacing:-.75px;
      margin-bottom:6px;
    }
    .login-sub{
      text-align:center;
      color:#8d7c83;
      font-size:13px;
      line-height:1.55;
      font-weight:700;
      margin-bottom:16px;
    }

    input{
      width:100%;
      height:50px;
      border-radius:18px;
      border:1px solid #f3dfe7;
      background:#fff7fa;
      color:#2f272a;
      padding:0 15px;
      font-size:14.5px;
      outline:none;
      margin-bottom:10px;
      font-weight:700;
    }
    input::placeholder{color:#aa9ba1;font-weight:700;}
    input:focus{
      background:#fff;
      border-color:#ff8fb1;
      box-shadow:0 0 0 4px rgba(255,92,138,.08);
    }

    .main-btn,
    .kakao-btn,
    .join{
      width:100%;
      min-height:51px;
      border:none;
      border-radius:18px;
      font-size:14px;
      font-weight:900;
      margin-top:9px;
    }
    .main-btn{
      background:#ff5c8a;
      color:#fff;
      box-shadow:0 12px 26px rgba(255,92,138,.22);
    }
    .kakao-btn{
      background:#FEE500;
      color:#191919;
      box-shadow:none;
    }
    .join{
      background:#fff;
      color:#ff5c8a;
      border:1px solid #ffd6e7;
      box-shadow:none;
    }
    button:active{transform:scale(.985);}
    button:disabled{opacity:.65;cursor:not-allowed;transform:none;}

    .trust{
      margin-top:13px;
      padding:13px;
      border-radius:18px;
      background:#fff7fa;
      border:1px solid #f3dfe7;
      color:#8d7c83;
      font-size:12.5px;
      line-height:1.5;
      text-align:center;
      font-weight:800;
    }
    .bottom-note{
      background:#ff5c8a;
      color:#fff;
      border-radius:24px;
      padding:18px 16px;
      box-shadow:0 12px 28px rgba(255,92,138,.18);
    }
    .bottom-note h3{
      font-size:18px;
      font-weight:900;
      letter-spacing:-.5px;
      margin-bottom:7px;
    }
    .bottom-note p{
      font-size:13px;
      line-height:1.6;
      font-weight:700;
      opacity:.94;
    }

    @supports(padding:max(0px)){
      .app{
        padding-top:max(18px, env(safe-area-inset-top));
        padding-left:max(14px, env(safe-area-inset-left));
        padding-right:max(14px, env(safe-area-inset-right));
        padding-bottom:max(26px, env(safe-area-inset-bottom));
      }
    }

    body.dark-mode{
      background:#181216;
      color:#f7edf2;
    }
    body.dark-mode .brand{color:#ff8fb1;}
    body.dark-mode .mini-logo{background:#ff8fb1;}
    body.dark-mode .mini-logo::after{background:#2a1d24;}
    body.dark-mode .badge,
    body.dark-mode .dark-mode-toggle,
    body.dark-mode .tag,
    body.dark-mode .join{
      background:#3a2430;
      color:#ff8fb1;
      border-color:#5b3747;
    }
    body.dark-mode .hero,
    body.dark-mode .category,
    body.dark-mode .login-box{
      background:#261b22;
      border-color:#4a303b;
      box-shadow:0 12px 26px rgba(0,0,0,.24);
    }
    body.dark-mode .hero::after{background:#573040;opacity:.34;}
    body.dark-mode h1,
    body.dark-mode .login-box h2,
    body.dark-mode .bottom-note h3{color:#fff6fa;}
    body.dark-mode h1 span,
    body.dark-mode .login-box h2{color:#ff8fb1;}
    body.dark-mode .desc,
    body.dark-mode .login-sub,
    body.dark-mode .category span,
    body.dark-mode .trust{color:#c9aeb9;}
    body.dark-mode input,
    body.dark-mode .trust{
      background:#2f2028;
      border-color:#4a303b;
      color:#f5e8ee;
    }
    body.dark-mode input::placeholder{color:#bfa5b0;}
    body.dark-mode input:focus{
      background:#34242d;
      border-color:#ff8fb1;
      box-shadow:0 0 0 4px rgba(255,143,177,.12);
    }
    body.dark-mode .app-logo{
      background:linear-gradient(135deg,#3a2430,#553144);
      box-shadow:0 12px 28px rgba(0,0,0,.24);
    }
    body.dark-mode .moon{background:#ff8fb1;}
    body.dark-mode .moon::after{background:#2a1d24;}
    body.dark-mode .heart{color:#ffc1d5;}
    body.dark-mode .bottom-note{
      background:#3a2430;
      color:#ffc1d5;
      border:1px solid #5b3747;
      box-shadow:0 12px 28px rgba(0,0,0,.22);
    }
    body.dark-mode .bottom-note p{color:#f8dbe6;}

    @media(max-width:390px){
      .app{padding-left:11px;padding-right:11px;}
      .category-row{gap:6px;}
      .category{min-height:61px;border-radius:16px;}
      .category span{font-size:10px;}
      h1{font-size:25px;}
      .hero,.login-box{border-radius:23px;}
      .top{align-items:flex-start;}
      .top-actions{gap:6px;}
      .badge{display:none;}
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="top">
      <div class="brand">
        <span class="mini-logo"></span>
        오늘도육아
      </div>

      <div class="top-actions">
        <button class="dark-mode-toggle" data-mode="icon" type="button" onclick="toggleDarkMode()">🌙</button>
        <div class="badge">따뜻한 공간</div>
      </div>
    </div>

    <section class="hero">
      <div class="tag">오늘도 버틴 부모들을 위한 공간</div>
      <h1>
        혼자 참는 육아 말고,<br>
        <span>함께 나누는</span><br>
        따뜻한 이야기
      </h1>
      <p class="desc">
        출산 준비부터 새벽 수유,<br>
        독박육아 고민까지 함께 나눠보세요.
      </p>
    </section>

    <div class="category-row">
      <div class="category"><div>🤰</div><span>출산준비</span></div>
      <div class="category"><div>🌙</div><span>새벽육아</span></div>
      <div class="category"><div>🍼</div><span>신생아</span></div>
      <div class="category"><div>🧸</div><span>영유아</span></div>
      <div class="category"><div>🧒</div><span>어린이</span></div>
    </div>

    <div class="login-box">
      <div class="app-logo">
        <div class="moon"></div>
        <div class="heart">♥</div>
      </div>

      <h2>로그인</h2>
      <p class="login-sub">
        아이디 또는 카카오톡으로<br>
        오늘도육아에 들어가 보세요.
      </p>

      <input type="text" id="loginId" placeholder="아이디 입력" autocomplete="username" inputmode="text">
      <input type="password" id="password" placeholder="비밀번호 입력" autocomplete="current-password">

      <button id="loginBtn" class="main-btn" type="button">로그인하기</button>
      <button id="kakaoBtn" class="kakao-btn" type="button">카카오톡으로 로그인</button>

      <a href="join.html">
        <button class="join" type="button">처음이라면 회원가입</button>
      </a>

      <div class="trust">
        닉네임 기반으로 안전하게 활동할 수 있어요.
      </div>
    </div>

    <div class="bottom-note">
      <h3>조용하고 따뜻한 육아 공간</h3>
      <p>
        복잡한 맘카페보다 더 편안하게,<br>
        오늘의 육아 이야기를 나눠보세요.
      </p>
    </div>
  </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      OAuthProvider,
      signInWithRedirect,
      getRedirectResult
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD4x9d4aQlbroxcnT2v-zHODDPdQabIFx0",
      authDomain: "today-parenting-app.firebaseapp.com",
      projectId: "today-parenting-app",
      storageBucket: "today-parenting-app.firebasestorage.app",
      messagingSenderId: "375329953167",
      appId: "1:375329953167:web:d29af0e45cc7d10e9f67fa"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginBtn = document.getElementById("loginBtn");
    const kakaoBtn = document.getElementById("kakaoBtn");
    const loginId = document.getElementById("loginId");
    const password = document.getElementById("password");

    function makeEmailFromId(id){
      return id.trim().toLowerCase() + "@todayparenting.local";
    }

    function goAfterLogin(id){
      const cleanId = id.trim().toLowerCase();

      if(cleanId === "admin"){
        window.location.href = "admin.html";
        return;
      }

      window.location.href = "home.html";
    }

    loginBtn.addEventListener("click", async () => {
      if(loginId.value.trim() === ""){
        alert("아이디를 입력해주세요.");
        return;
      }

      if(password.value.trim() === ""){
        alert("비밀번호를 입력해주세요.");
        return;
      }

      try{
        loginBtn.disabled = true;
        loginBtn.innerText = "로그인 중...";

        const fakeEmail = makeEmailFromId(loginId.value);

        await signInWithEmailAndPassword(
          auth,
          fakeEmail,
          password.value
        );

        goAfterLogin(loginId.value);
      } catch(error){
        alert("아이디 또는 비밀번호를 확인해주세요.");

        loginBtn.disabled = false;
        loginBtn.innerText = "로그인하기";
      }
    });

    kakaoBtn.addEventListener("click", async () => {
      try{
        kakaoBtn.disabled = true;
        kakaoBtn.innerText = "카카오 로그인 중...";

        const provider = new OAuthProvider("oidc.kakao");
        await signInWithRedirect(auth, provider);
      } catch(error){
        alert(error.message);
        kakaoBtn.disabled = false;
        kakaoBtn.innerText = "카카오톡으로 로그인";
      }
    });

    async function checkKakaoRedirect(){
      try{
        const result = await getRedirectResult(auth);

        if(!result){
          return;
        }

        const user = result.user;
        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);

        if(!userSnap.exists()){
          await setDoc(userRef, {
            nickname: user.displayName || "카카오사용자",
            loginId: "",
            email: user.email || "",
            realEmail: user.email || "",
            loginType: "kakao",
            stage: "예비부모",
            categories: [
              "출산준비",
              "새벽육아",
              "신생아",
              "영유아",
              "어린이"
            ],
            status: "초보엄마예요 💕",
            photoUrl: user.photoURL || "",
            createdAt: new Date()
          });
        }

        window.location.href = "home.html";
      } catch(error){
        console.log(error.message);
      }
    }

    document.addEventListener("keydown", async (event) => {
      if(event.key !== "Enter"){
        return;
      }

      const activeElement = document.activeElement;

      if(activeElement === loginId || activeElement === password){
        event.preventDefault();
        loginBtn.click();
      }
    });

    checkKakaoRedirect();
  </script>

<script src="theme.js"></script>

</body>
</html>
